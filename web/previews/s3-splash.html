<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S3 Splash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100%; height: 100vh; overflow: hidden;
    background: linear-gradient(180deg, #FFF5F5 0%, #FCE4EC 50%, #F3E5F5 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .splash {
    display: flex; flex-direction: column; align-items: center; gap: 0;
    opacity: 0; transform: scale(0.5);
    animation: splashIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
  }
  @keyframes splashIn {
    to { opacity: 1; transform: scale(1); }
  }
  .icon {
    width: 120px; height: 120px; border-radius: 24px;
    background: linear-gradient(180deg, #FFF5F5, #FCE4EC);
    border: 1px solid rgba(183,110,121,0.2);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 20px 60px rgba(183,110,121,0.25);
    margin-bottom: 32px;
  }
  .icon svg { width: 72px; height: 72px; }
  .title {
    font-size: 28px; font-weight: 800; letter-spacing: 1.2px;
    background: linear-gradient(90deg, #B76E79, #E8A0BF, #C8A2C8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px;
  }
  .sub {
    font-size: 13px; font-weight: 500; color: #B76E79;
    letter-spacing: 0.5px; margin-bottom: 6px;
    font-family: -apple-system, sans-serif;
  }
  .sub2 {
    font-size: 12px; color: #C8A2C8;
    font-family: -apple-system, sans-serif;
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="icon">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="72" height="72" rx="16" fill="url(#g)"/>
        <text x="50%" y="54%" font-family="monospace" font-size="22" fill="#B76E79" text-anchor="middle" dominant-baseline="middle" font-weight="bold">S³</text>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="72">
            <stop offset="0%" stop-color="#FFF5F5"/>
            <stop offset="100%" stop-color="#FCE4EC"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="title">S³</div>
    <div class="sub">Screenshot Smart Sorter</div>
    <div class="sub2">スクショを瞬時に整理</div>
  </div>
</body>
</html>
