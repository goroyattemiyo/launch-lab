<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thunder Orbit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #04040a; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #04040a; }
  .orbit-ring { position: absolute; border-radius: 50%; }
  .orbit-1 { width: 280px; height: 280px; border: 1px solid rgba(180,180,255,0.1); animation: orbit-spin 2s linear infinite; }
  .orbit-2 { width: 200px; height: 200px; border: 1px solid rgba(200,200,255,0.15); animation: orbit-spin 1.4s linear infinite reverse; }
  @keyframes orbit-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .bolt { position: absolute; width: 2px; height: 20px; background: linear-gradient(to bottom, rgba(220,220,255,0.9), transparent); border-radius: 1px; animation: bolt-flash 2s ease-in-out infinite; }
  .b1 { top: 20%; left: 30%; transform: rotate(15deg); animation-delay: 0s; }
  .b2 { top: 55%; right: 25%; transform: rotate(-20deg); animation-delay: 0.7s; }
  .b3 { bottom: 25%; left: 50%; transform: rotate(10deg); animation-delay: 1.4s; height: 14px; }
  @keyframes bolt-flash { 0%,100% { opacity: 0; } 10%,20% { opacity: 1; filter: drop-shadow(0 0 4px rgba(180,180,255,0.8)); } 30% { opacity: 0; } }
  .flash { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, rgba(180,180,255,0.04), transparent 60%); animation: flash-pulse 2s ease-in-out infinite; }
  @keyframes flash-pulse { 0%,100% { opacity: 0.4; } 15% { opacity: 1; } }
  .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: rgba(200,200,255,0.9); box-shadow: 0 0 8px rgba(180,180,255,0.8); animation: dot-orbit 2s linear infinite; }
  @keyframes dot-orbit { from { transform: rotate(0deg) translateX(140px); } to { transform: rotate(360deg) translateX(140px); } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 0.8s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: scale(1.08); } to { opacity:1; transform: scale(1); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(180,180,255,0.4); margin-bottom: 12px; }
  .title { font-size: 40px; font-weight: 800; letter-spacing: 0.15em; color: rgba(220,220,255,0.95); animation: title-glow 2s ease-in-out infinite; }
  @keyframes title-glow { 0%,100% { text-shadow: 0 0 20px rgba(180,180,255,0.3); } 50% { text-shadow: 0 0 40px rgba(180,180,255,0.7), 0 0 80px rgba(140,140,255,0.3); } }
  .divider { width: 24px; height: 1px; background: rgba(180,180,255,0.4); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(180,180,255,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="flash"></div>
  <div class="orbit-ring orbit-1"></div><div class="orbit-ring orbit-2"></div>
  <div class="bolt b1"></div><div class="bolt b2"></div><div class="bolt b3"></div>
  <div class="dot"></div>
  <div class="content"><p class="label">Game Start</p><h1 class="title">THUNDER</h1><div class="divider"></div><p class="sub">Orbit</p></div>
</div>
</body>
</html>
