<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Circle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(16px, 3.5vw, 24px); color: #e0d8cc; letter-spacing: 0.5em; opacity: 0; animation: fadeIn 0.8s 2s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">禅　Zen Circle</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
const cx = W/2, cy = H/2;
const R = Math.min(W, H) * 0.3;
let t = 0;
const DURATION = 80; // フレーム数で一筆

function easeInOut(x) {
  return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
}

// 筆圧変化（円の描画中の太さ変化）
function brushWidth(progress) {
  // 始まりは細く、途中で太く、終わりはかすれる
  if (progress < 0.1) return progress / 0.1 * 14;
  if (progress < 0.7) return 14 + Math.sin(progress * Math.PI) * 6;
  return 14 * (1 - (progress - 0.7) / 0.3) + 4;
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  t++;

  const progress = Math.min(1, t / DURATION);
  const easedP = easeInOut(progress);

  // 円弧を描く（始点から終点まで）
  const startAngle = -Math.PI / 2; // 上から開始
  const endAngle = startAngle + easedP * Math.PI * 2;

  // 筆のセグメントを描く
  const steps = Math.floor(easedP * 120);
  for (let i = 0; i < steps; i++) {
    const a0 = startAngle + (i / 120) * Math.PI * 2;
    const a1 = startAngle + ((i + 1) / 120) * Math.PI * 2;
    const p = i / 120;

    ctx.beginPath();
    ctx.arc(cx, cy, R, a0, a1);
    ctx.lineWidth = brushWidth(p);
    ctx.lineCap = 'round';

    // 墨の濃淡
    const inkAlpha = 0.7 + Math.sin(p * Math.PI * 4) * 0.15;
    ctx.strokeStyle = `rgba(20,15,10,${inkAlpha})`;
    ctx.stroke();
  }

  // かすれ（終端）
  if (progress > 0.85) {
    const featherProgress = (progress - 0.85) / 0.15;
    const angle = startAngle + easedP * Math.PI * 2;
    for (let i = 0; i < 8; i++) {
      const da = (Math.random() - 0.5) * 0.1;
      const dr = (Math.random() - 0.5) * 8;
      const len = Math.random() * 15 * featherProgress;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle + da) * (R + dr), cy + Math.sin(angle + da) * (R + dr));
      ctx.lineTo(cx + Math.cos(angle + da + 0.05) * (R + dr + len), cy + Math.sin(angle + da + 0.05) * (R + dr + len));
      ctx.lineWidth = Math.random() * 2;
      ctx.strokeStyle = `rgba(20,15,10,${Math.random() * 0.4})`;
      ctx.stroke();
    }
  }

  if (t < 200) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
