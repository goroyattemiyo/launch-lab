<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Letter Storm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020205; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: "Segoe UI", sans-serif; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(180,180,255,0.35); margin-bottom: 12px; }
  .title { font-size: 48px; font-weight: 900; letter-spacing: 0.05em; color: rgba(220,220,255,0.95); animation: storm-glow 2s ease-in-out infinite; }
  @keyframes storm-glow { 0%,100%{text-shadow:0 0 20px rgba(120,120,255,0.4);} 50%{text-shadow:0 0 40px rgba(150,150,255,0.7),0 0 80px rgba(100,100,255,0.3);} }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(150,150,255,0.3); text-transform: uppercase; margin-top: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Typography</p>
  <h1 class="title">STORM</h1>
  <p class="sub">Letter Storm</p>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=800;c.height=480;
const W=c.width,H=c.height;
const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%';
let t=0;
const particles=Array.from({length:80},()=>({
  ch:ALPHA[Math.floor(Math.random()*ALPHA.length)],
  x:Math.random()*W,y:Math.random()*H,
  angle:Math.random()*Math.PI*2,
  speed:0.3+Math.random()*1.5,
  size:10+Math.random()*20,
  hue:200+Math.random()*60,
  alpha:0.1+Math.random()*0.5,
  phase:Math.random()*Math.PI*2,
  orbit:50+Math.random()*150,
}));
const cx=W/2,cy=H/2;
function draw(){
  t+=0.01;
  ctx.fillStyle='rgba(2,2,5,0.1)';
  ctx.fillRect(0,0,W,H);
  particles.forEach(p=>{
    p.angle+=p.speed*0.02;
    const pull=0.002;
    const dx=cx-p.x,dy=cy-p.y;
    p.x+=Math.cos(p.angle)*p.speed+dx*pull;
    p.y+=Math.sin(p.angle)*p.speed+dy*pull;
    if(Math.abs(dx)<10&&Math.abs(dy)<10){
      p.angle+=Math.PI+Math.random()*0.5;
      p.speed=1+Math.random()*3;
      p.ch=ALPHA[Math.floor(Math.random()*ALPHA.length)];
    }
    const dist=Math.sqrt(dx*dx+dy*dy);
    const a=p.alpha*(0.5+0.5*(dist/300));
    ctx.globalAlpha=Math.min(a,0.8);
    ctx.fillStyle=`hsl(${p.hue},70%,65%)`;
    ctx.font=`700 ${p.size}px Arial`;
    ctx.textAlign='center';
    ctx.fillText(p.ch,p.x,p.y);
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
