<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Static Ghost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030303; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: "Courier New", monospace; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; animation: ghost-appear 3s ease-out forwards; opacity: 0; }
  @keyframes ghost-appear { 0%{opacity:0;} 40%{opacity:0.1;} 60%{opacity:0;} 80%{opacity:0.6;} 90%{opacity:0.2;} 100%{opacity:0.85;} }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(200,200,200,0.3); margin-bottom: 12px; }
  .title { font-size: 44px; font-weight: 700; letter-spacing: 0.15em; color: rgba(220,220,220,0.85); animation: static-flicker 0.1s steps(1) infinite; }
  @keyframes static-flicker { 0%{text-shadow:2px 0 rgba(255,0,0,0.4),-2px 0 rgba(0,255,255,0.4);} 50%{text-shadow:-1px 0 rgba(255,0,0,0.3),1px 0 rgba(0,255,255,0.3);} 100%{text-shadow:1px 1px rgba(255,0,0,0.4),-1px -1px rgba(0,255,255,0.4);} }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(180,180,180,0.25); text-transform: uppercase; margin-top: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Horror</p>
  <h1 class="title">STATIC</h1>
  <p class="sub">Ghost</p>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = 800; c.height = 480;
const W = c.width, H = c.height;
let t = 0;
function draw() {
  t++;
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 40;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 180;
  }
  ctx.putImageData(img, 0, 0);
  if (t % 3 === 0) {
    const y = Math.random() * H;
    const h = 1 + Math.random() * 4;
    ctx.fillStyle = `rgba(200,200,200,${0.05+Math.random()*0.1})`;
    ctx.fillRect(0, y, W, h);
  }
  if (t % 7 === 0) {
    const x = Math.random()*W*0.3;
    ctx.fillStyle = `rgba(200,200,220,0.03)`;
    ctx.fillRect(x, 0, Math.random()*W*0.4, H);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
