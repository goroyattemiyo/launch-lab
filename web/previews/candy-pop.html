<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candy Pop</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    min-width: 320px;
    min-height: 480px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1a0a1a 0%, #09090b 70%);
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    top: 50%;
    left: 50%;
  }

  /* 各パーティクルをCSSで定義 */
  .p1  { width:10px;height:10px;margin:-5px 0 0 -5px;background:#ff6eb4;animation:pop 4s ease-out infinite 0.0s; }
  .p2  { width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:#ffe066;animation:pop 4s ease-out infinite 0.15s; }
  .p3  { width:8px;height:8px;margin:-4px 0 0 -4px;background:#66e5ff;animation:pop 4s ease-out infinite 0.3s; }
  .p4  { width:6px;height:6px;margin:-3px 0 0 -3px;background:#b36bff;animation:pop 4s ease-out infinite 0.45s; }
  .p5  { width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#ff9f66;animation:pop 4s ease-out infinite 0.6s; }
  .p6  { width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:#66ffb3;animation:pop 4s ease-out infinite 0.75s; }
  .p7  { width:8px;height:8px;margin:-4px 0 0 -4px;background:#ff6eb4;animation:pop2 4s ease-out infinite 0.1s; }
  .p8  { width:6px;height:6px;margin:-3px 0 0 -3px;background:#ffe066;animation:pop2 4s ease-out infinite 0.25s; }
  .p9  { width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:#66e5ff;animation:pop2 4s ease-out infinite 0.4s; }
  .p10 { width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:#b36bff;animation:pop2 4s ease-out infinite 0.55s; }
  .p11 { width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#ff9f66;animation:pop3 4s ease-out infinite 0.2s; }
  .p12 { width:6px;height:6px;margin:-3px 0 0 -3px;background:#66ffb3;animation:pop3 4s ease-out infinite 0.35s; }

  @keyframes pop {
    0%   { transform: translate(0,0) scale(0); opacity:1; }
    20%  { transform: translate(80px,-90px) scale(1); opacity:1; }
    60%  { transform: translate(110px,-30px) scale(0.8); opacity:0.7; }
    100% { transform: translate(130px,60px) scale(0); opacity:0; }
  }
  @keyframes pop2 {
    0%   { transform: translate(0,0) scale(0); opacity:1; }
    20%  { transform: translate(-70px,-100px) scale(1); opacity:1; }
    60%  { transform: translate(-100px,-20px) scale(0.8); opacity:0.7; }
    100% { transform: translate(-120px,70px) scale(0); opacity:0; }
  }
  @keyframes pop3 {
    0%   { transform: translate(0,0) scale(0); opacity:1; }
    20%  { transform: translate(20px,-130px) scale(1); opacity:1; }
    60%  { transform: translate(40px,-160px) scale(0.7); opacity:0.6; }
    100% { transform: translate(10px,-200px) scale(0); opacity:0; }
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: bounce-in 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes bounce-in {
    from { opacity:0; transform: scale(0.6); }
    to   { opacity:1; transform: scale(1); }
  }
  .label {
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,110,180,0.7);
    margin-bottom: 10px;
  }
  .title {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #ff6eb4, #ffe066, #66e5ff, #b36bff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient-shift 4s linear infinite;
    background-size: 300% 300%;
  }
  @keyframes gradient-shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .sub {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }
  .burst {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,110,180,0.15), transparent 70%);
    animation: burst-pulse 4s ease-in-out infinite;
  }
  @keyframes burst-pulse {
    0%,100% { transform: scale(0.8); opacity:0.5; }
    50%     { transform: scale(1.3); opacity:1; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="burst"></div>
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>
  <div class="particle p7"></div>
  <div class="particle p8"></div>
  <div class="particle p9"></div>
  <div class="particle p10"></div>
  <div class="particle p11"></div>
  <div class="particle p12"></div>
  <div class="content">
    <p class="label">Cute / Pop</p>
    <h1 class="title">CANDY</h1>
    <p class="sub">Pop Intro</p>
  </div>
</div>
</body>
</html>
