<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glitch Text</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030303; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: "Courier New", monospace; }
  .stage { position: relative; width: 100%; min-height: 480px; display: grid; place-items: center; overflow: hidden; }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 16px; }
  .glitch-wrap { position: relative; }
  .glitch-main { font-size: 52px; font-weight: 900; letter-spacing: 0.1em; color: white; position: relative; animation: g-main 3s steps(1) infinite; }
  @keyframes g-main { 0%,90%,100%{transform:translate(0);} 91%{transform:translate(-3px,1px);} 92%{transform:translate(3px,-1px);} 93%{transform:translate(-2px,2px);} 94%{transform:translate(0);} }
  .glitch-r { position:absolute;top:0;left:0;font-size:52px;font-weight:900;letter-spacing:0.1em;color:#ff003c;clip-path:polygon(0 20%,100% 20%,100% 40%,0 40%);animation:g-r 3s steps(1) infinite; }
  .glitch-b { position:absolute;top:0;left:0;font-size:52px;font-weight:900;letter-spacing:0.1em;color:#00d4ff;clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%);animation:g-b 3s steps(1) infinite; }
  @keyframes g-r { 0%,90%,100%{transform:translateX(0);opacity:0.7;} 91%{transform:translateX(6px);opacity:1;} 93%{transform:translateX(-4px);} 95%{transform:translateX(0);opacity:0.7;} }
  @keyframes g-b { 0%,90%,100%{transform:translateX(0);opacity:0.7;} 92%{transform:translateX(-8px);opacity:1;} 94%{transform:translateX(5px);} 96%{transform:translateX(0);opacity:0.7;} }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(255,255,255,0.2); text-transform: uppercase; margin-top: 16px; }
  .scan { position:absolute;width:100%;height:2px;background:rgba(255,255,255,0.04);animation:scan-move 4s linear infinite; }
  @keyframes scan-move { from{top:0;} to{top:100%;} }
</style>
</head>
<body>
<div class="stage">
  <div class="scan"></div>
  <div style="text-align:center;position:relative;z-index:2;">
    <p class="label">Typography</p>
    <div class="glitch-wrap">
      <h1 class="glitch-main" data-text="GLITCH">GLITCH</h1>
      <div class="glitch-r">GLITCH</div>
      <div class="glitch-b">GLITCH</div>
    </div>
    <p class="sub">Glitch Text</p>
  </div>
</div>
</body>
</html>
