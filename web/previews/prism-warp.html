<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prism Warp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: "Segoe UI", sans-serif; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 12px; }
  .title { font-size: 46px; font-weight: 100; letter-spacing: 0.3em; color: rgba(255,255,255,0.9); animation: prism-shift 2s ease-in-out infinite; }
  @keyframes prism-shift {
    0%   { text-shadow: 3px 0 rgba(255,0,100,0.7), -3px 0 rgba(0,255,255,0.7); }
    33%  { text-shadow: -3px 0 rgba(255,200,0,0.7), 3px 0 rgba(0,100,255,0.7); }
    66%  { text-shadow: 0 3px rgba(200,0,255,0.7), 0 -3px rgba(0,255,100,0.7); }
    100% { text-shadow: 3px 0 rgba(255,0,100,0.7), -3px 0 rgba(0,255,255,0.7); }
  }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(255,255,255,0.25); text-transform: uppercase; margin-top: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Psychedelic</p>
  <h1 class="title">PRISM</h1>
  <p class="sub">Warp</p>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = 800; c.height = 480;
const W = c.width, H = c.height;
let t = 0;
const rays = Array.from({length: 24}, (_, i) => ({ angle: (i / 24) * Math.PI * 2, hue: i * 15 }));
function draw() {
  t += 0.015;
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, 0, W, H);
  const cx = W/2, cy = H/2;
  rays.forEach((r, i) => {
    r.angle += 0.008 + Math.sin(t + i * 0.3) * 0.005;
    const len = 280 + Math.sin(t * 1.5 + i) * 80;
    const x2 = cx + Math.cos(r.angle) * len;
    const y2 = cy + Math.sin(r.angle) * len;
    const grad = ctx.createLinearGradient(cx, cy, x2, y2);
    grad.addColorStop(0, `hsla(${r.hue + t * 20},100%,60%,0)`);
    grad.addColorStop(0.3, `hsla(${r.hue + t * 20},100%,60%,0.15)`);
    grad.addColorStop(1, `hsla(${(r.hue + 60 + t * 20) % 360},100%,70%,0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2 + Math.sin(t + i) * 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    r.hue = (r.hue + 0.3) % 360;
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
