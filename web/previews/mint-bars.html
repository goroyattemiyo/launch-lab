<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mint Bars</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #020a06; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #020a06; }
  .bars { position: absolute; bottom: 0; left: 0; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 6px; padding: 0 30px; height: 160px; }
  .bar { flex: 1; max-width: 18px; border-radius: 3px 3px 0 0; background: linear-gradient(to top, rgba(0,200,130,0.85), rgba(100,255,200,0.45)); animation: bar-rise 1.1s ease-out forwards, bar-pulse 2.8s ease-in-out infinite 1.1s; }
  .bar:nth-child(1) { height: 45px;  animation-delay: 0.0s, 1.1s; }
  .bar:nth-child(2) { height: 80px;  animation-delay: 0.1s, 1.2s; }
  .bar:nth-child(3) { height: 110px; animation-delay: 0.2s, 1.3s; }
  .bar:nth-child(4) { height: 130px; animation-delay: 0.15s, 1.25s; }
  .bar:nth-child(5) { height: 100px; animation-delay: 0.25s, 1.35s; }
  .bar:nth-child(6) { height: 65px;  animation-delay: 0.1s, 1.2s; }
  .bar:nth-child(7) { height: 35px;  animation-delay: 0.05s, 1.15s; }
  @keyframes bar-rise { from { height: 0; opacity: 0; } to { opacity: 1; } }
  @keyframes bar-pulse { 0%,100% { filter: brightness(0.85); } 50% { filter: brightness(1.25) drop-shadow(0 0 5px rgba(0,200,130,0.5)); } }
  .content { position: relative; z-index: 2; text-align: center; margin-bottom: 80px; animation: rise-in 1.0s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(0,200,130,0.4); margin-bottom: 12px; }
  .title { font-size: 44px; font-weight: 300; letter-spacing: 0.24em; color: rgba(180,255,230,0.92); animation: title-glow 2.8s ease-in-out infinite; }
  @keyframes title-glow { 0%,100% { text-shadow: 0 0 20px rgba(0,200,130,0.2); } 50% { text-shadow: 0 0 40px rgba(0,200,130,0.5), 0 0 70px rgba(0,180,120,0.2); } }
  .divider { width: 24px; height: 1px; background: rgba(0,200,130,0.4); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(0,200,130,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="bars">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
  <div class="content"><p class="label">App Launch</p><h1 class="title">MINT</h1><div class="divider"></div><p class="sub">Bars</p></div>
</div>
</body>
</html>
