<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ice Sweep</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #020810; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #020810; }
  .sweep { position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(105deg, transparent 30%, rgba(180,230,255,0.12) 50%, rgba(200,240,255,0.06) 55%, transparent 70%); animation: sweep 3.5s cubic-bezier(0.4,0,0.6,1) infinite; animation-delay: 0.8s; }
  @keyframes sweep { 0% { left: -100%; } 65%,100% { left: 160%; } }
  .crystal { position: absolute; width: 6px; height: 6px; background: rgba(180,230,255,0.4); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); animation: crystal-float 4s ease-in-out infinite; }
  .c1 { top: 25%; left: 18%; animation-delay: 0s; }
  .c2 { top: 60%; right: 20%; animation-delay: 1s; width: 8px; height: 8px; }
  .c3 { top: 40%; right: 30%; animation-delay: 2s; width: 5px; height: 5px; }
  .c4 { bottom: 28%; left: 35%; animation-delay: 0.5s; }
  @keyframes crystal-float { 0%,100% { transform: rotate(0deg) scale(1); opacity: 0.4; } 50% { transform: rotate(45deg) scale(1.3); opacity: 0.8; } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 1.3s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: translateY(0); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(150,220,255,0.4); margin-bottom: 12px; }
  .title { font-size: 44px; font-weight: 200; letter-spacing: 0.28em; color: rgba(210,240,255,0.92); animation: title-ice 3.5s ease-in-out infinite; }
  @keyframes title-ice { 0%,100% { text-shadow: 0 0 20px rgba(150,220,255,0.2); } 50% { text-shadow: 0 0 40px rgba(150,220,255,0.5), 0 0 70px rgba(100,180,255,0.2); } }
  .divider { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(150,220,255,0.5), transparent); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(150,220,255,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="sweep"></div>
  <div class="crystal c1"></div><div class="crystal c2"></div><div class="crystal c3"></div><div class="crystal c4"></div>
  <div class="content"><p class="label">Landing Page</p><h1 class="title">ICE</h1><div class="divider"></div><p class="sub">Sweep</p></div>
</div>
</body>
</html>
