<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ember Pulse</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #070402; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #070402; }
  .ring { position: absolute; border-radius: 50%; animation: pulse-ring 3.5s ease-in-out infinite; }
  .ring-1 { width: 300px; height: 300px; border: 1px solid rgba(180,80,20,0.15); animation-delay: 0s; }
  .ring-2 { width: 210px; height: 210px; border: 1px solid rgba(220,120,30,0.18); animation-delay: 0.7s; }
  @keyframes pulse-ring { 0%,100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.06); opacity: 1; } }
  .ember { position: absolute; border-radius: 50%; animation: ember-drift ease-in-out infinite; }
  .e1 { width: 3px; height: 3px; background: rgba(255,120,30,0.9); top: 50%; left: 30%; animation-duration: 4s; animation-delay: 0s; }
  .e2 { width: 2px; height: 2px; background: rgba(255,80,10,0.8); top: 45%; right: 28%; animation-duration: 5s; animation-delay: 1s; }
  .e3 { width: 4px; height: 4px; background: rgba(255,160,50,0.7); bottom: 35%; left: 45%; animation-duration: 3.5s; animation-delay: 2s; }
  .e4 { width: 2px; height: 2px; background: rgba(255,100,20,0.9); top: 38%; left: 55%; animation-duration: 4.5s; animation-delay: 0.5s; }
  @keyframes ember-drift { 0% { transform: translate(0,0) scale(1); opacity: 0.9; } 50% { transform: translate(15px,-25px) scale(0.8); opacity: 0.7; } 100% { transform: translate(-5px,-50px) scale(0); opacity: 0; } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 1.3s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: translateY(0); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(200,100,30,0.4); margin-bottom: 12px; }
  .title { font-size: 40px; font-weight: 300; letter-spacing: 0.3em; color: rgba(255,220,180,0.88); animation: title-pulse 3.5s ease-in-out infinite; }
  @keyframes title-pulse { 0%,100% { text-shadow: 0 0 20px rgba(200,80,20,0.2); } 50% { text-shadow: 0 0 40px rgba(220,100,30,0.5); } }
  .divider { width: 28px; height: 1px; background: rgba(200,100,30,0.4); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(200,100,30,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="ring ring-1"></div><div class="ring ring-2"></div>
  <div class="ember e1"></div><div class="ember e2"></div><div class="ember e3"></div><div class="ember e4"></div>
  <div class="content"><p class="label">Brand Intro</p><h1 class="title">燠火</h1><div class="divider"></div><p class="sub">Ember Pulse</p></div>
</div>
</body>
</html>
