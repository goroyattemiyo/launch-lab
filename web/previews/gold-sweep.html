<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gold Sweep</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080600; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #080600; }
  .sweep { position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(105deg, transparent 30%, rgba(212,175,55,0.15) 50%, rgba(255,215,0,0.08) 55%, transparent 70%); animation: sweep 3s cubic-bezier(0.4,0,0.6,1) infinite; animation-delay: 0.5s; }
  @keyframes sweep { 0% { left: -100%; } 60%,100% { left: 160%; } }
  .line { position: absolute; width: 100%; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(212,175,55,0.3) 20%, rgba(255,215,0,0.6) 50%, rgba(212,175,55,0.3) 80%, transparent 100%); animation: line-sweep 3s cubic-bezier(0.4,0,0.6,1) infinite; animation-delay: 0.5s; }
  @keyframes line-sweep { 0% { opacity: 0; transform: translateX(-100%); } 10% { opacity: 1; } 60% { opacity: 0; transform: translateX(100%); } 100% { opacity: 0; transform: translateX(100%); } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 1.2s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(212,175,55,0.4); margin-bottom: 12px; }
  .title { font-size: 44px; font-weight: 300; letter-spacing: 0.3em; color: rgba(255,230,150,0.92); font-family: Georgia, serif; animation: title-shimmer 3s ease-in-out infinite; }
  @keyframes title-shimmer { 0%,100% { text-shadow: 0 0 20px rgba(212,175,55,0.2); } 50% { text-shadow: 0 0 40px rgba(212,175,55,0.5), 0 2px 8px rgba(0,0,0,0.5); } }
  .divider { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.6), transparent); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(212,175,55,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="sweep"></div><div class="line"></div>
  <div class="content"><p class="label">Brand Intro</p><h1 class="title">GOLD</h1><div class="divider"></div><p class="sub">Sweep</p></div>
</div>
</body>
</html>
