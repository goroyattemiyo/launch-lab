<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bamboo Rise</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060e08; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(16px, 3.5vw, 24px); color: #b8d890; letter-spacing: 0.4em; opacity: 0; animation: fadeIn 1s 2s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Bamboo Rise</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
let t = 0;

function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

const stalks = [];
const COUNT = 9;
for (let i = 0; i < COUNT; i++) {
  stalks.push({
    x: W * (0.08 + i * 0.1) + (Math.random() - 0.5) * W * 0.04,
    w: 8 + Math.random() * 12,
    h: H * (0.5 + Math.random() * 0.45),
    delay: i * 0.06,
    hue: 95 + Math.random() * 25,
    nodeCount: 4 + Math.floor(Math.random() * 3),
    lean: (Math.random() - 0.5) * 0.04,
    leaves: [],
  });
  // 葉を生成
  for (let j = 0; j < 4; j++) {
    stalks[i].leaves.push({
      nodeRatio: 0.2 + j * 0.2 + Math.random() * 0.05,
      side: j % 2 === 0 ? 1 : -1,
      angle: 0.3 + Math.random() * 0.3,
      len: 20 + Math.random() * 20,
    });
  }
}

function drawStalk(s, progress) {
  const p = Math.max(0, Math.min(1, (progress - s.delay) / (1 - s.delay)));
  if (p <= 0) return;
  const ep = easeOutBack(p);

  const visH = s.h * Math.min(1, ep * 1.05);
  const topY = H - visH;
  const bottomY = H;
  const topX = s.x + s.lean * visH;

  // 節の描画
  const nodeSpacing = visH / s.nodeCount;

  // 竹の本体（グラデーション）
  const grad = ctx.createLinearGradient(s.x - s.w/2, 0, s.x + s.w/2, 0);
  grad.addColorStop(0, `hsl(${s.hue},50%,22%)`);
  grad.addColorStop(0.3, `hsl(${s.hue},60%,38%)`);
  grad.addColorStop(0.7, `hsl(${s.hue},55%,32%)`);
  grad.addColorStop(1, `hsl(${s.hue},45%,18%)`);

  for (let i = 0; i < s.nodeCount; i++) {
    const y0 = bottomY - nodeSpacing * (i + 1);
    const y1 = bottomY - nodeSpacing * i;
    if (y0 < topY) continue;

    ctx.fillStyle = grad;
    const leanOff = s.lean * (H - y0);
    ctx.fillRect(s.x + leanOff - s.w/2, Math.max(y0, topY), s.w, y1 - Math.max(y0, topY));

    // 節の線
    if (y0 > topY) {
      ctx.fillStyle = `hsl(${s.hue},40%,14%)`;
      ctx.fillRect(s.x + leanOff - s.w/2 - 2, y0, s.w + 4, 4);
    }
  }

  // 先端のグラデーション
  const tipGrad = ctx.createLinearGradient(0, topY, 0, topY + 20);
  tipGrad.addColorStop(0, `hsl(${s.hue + 10},65%,55%)`);
  tipGrad.addColorStop(1, `hsl(${s.hue},55%,35%)`);
  ctx.fillStyle = tipGrad;
  ctx.fillRect(s.x + s.lean * visH - s.w/2 + 1, topY, s.w - 2, 20);

  // 葉
  if (p > 0.6) {
    const leafP = (p - 0.6) / 0.4;
    s.leaves.forEach(l => {
      const leafY = bottomY - visH * l.nodeRatio;
      const leafX = s.x + s.lean * (H - leafY);
      const swayAngle = l.angle + Math.sin(t * 0.03 + s.x) * 0.08;
      const baseAngle = l.side > 0 ? -swayAngle : Math.PI + swayAngle;

      ctx.save();
      ctx.translate(leafX, leafY);
      ctx.rotate(baseAngle);
      ctx.globalAlpha = leafP;
      ctx.fillStyle = `hsl(${s.hue + 5},60%,40%)`;
      ctx.beginPath();
      ctx.ellipse(l.len * 0.5, 0, l.len * 0.5, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  t++;

  const progress = Math.min(1, t / 100);

  // 霧
  const fog = ctx.createLinearGradient(0, H * 0.6, 0, H);
  fog.addColorStop(0, 'rgba(20,40,20,0)');
  fog.addColorStop(1, `rgba(15,30,15,${Math.min(0.6, t / 150)})`);
  ctx.fillStyle = fog;
  ctx.fillRect(0, 0, W, H);

  stalks.forEach(s => drawStalk(s, progress));

  if (t < 400) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
