<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Veil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06080f; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(16px, 3.5vw, 24px); color: #d8e8f5; letter-spacing: 0.4em; opacity: 0; animation: fadeIn 1.5s 1s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Snow Veil</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
let t = 0;
const flakes = [];

function makeFlake() {
  return {
    x: Math.random() * W,
    y: -5,
    r: 0.5 + Math.random() * 2.5,
    vy: 0.3 + Math.random() * 0.8,
    vx: (Math.random() - 0.5) * 0.4,
    alpha: 0.3 + Math.random() * 0.6,
    drift: Math.random() * Math.PI * 2,
    driftSpeed: 0.01 + Math.random() * 0.015,
  };
}

for (let i = 0; i < 60; i++) {
  const f = makeFlake();
  f.y = Math.random() * H;
  flakes.push(f);
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  t++;

  if (t % 3 === 0 && flakes.length < 120) flakes.push(makeFlake());

  const fadeIn = Math.min(1, t / 40);

  // 遠景の雪（ぼんやり）
  flakes.forEach((f, i) => {
    f.drift += f.driftSpeed;
    f.x += f.vx + Math.sin(f.drift) * 0.3;
    f.y += f.vy;

    if (f.y > H + 10) {
      flakes.splice(i, 1);
      return;
    }

    ctx.save();
    ctx.globalAlpha = f.alpha * fadeIn;
    ctx.fillStyle = '#e8f0f8';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 積雪ライン（下部）
  if (t > 60) {
    const accumProgress = Math.min(1, (t - 60) / 180);
    const snowH = H * 0.05 * accumProgress;
    const g = ctx.createLinearGradient(0, H - snowH, 0, H);
    g.addColorStop(0, `rgba(220,232,245,${0.4 * accumProgress})`);
    g.addColorStop(1, `rgba(200,218,238,${0.6 * accumProgress})`);
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const wave = Math.sin(x * 0.04 + t * 0.005) * 3 * accumProgress;
      ctx.lineTo(x, H - snowH + wave);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  if (t < 400) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
