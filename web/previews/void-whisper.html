<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Void Whisper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #010101; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: Georgia, serif; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; }
  .label { font-size: 9px; letter-spacing: 0.6em; text-transform: uppercase; color: rgba(100,100,120,0.4); margin-bottom: 14px; font-family: "Segoe UI", sans-serif; }
  .title { font-size: 44px; font-weight: 200; letter-spacing: 0.3em; color: rgba(180,180,200,0.7); animation: void-pulse 5s ease-in-out infinite; }
  @keyframes void-pulse { 0%,100% { opacity:0.5; text-shadow: 0 0 20px rgba(100,100,180,0.2); } 50% { opacity:0.9; text-shadow: 0 0 40px rgba(120,120,200,0.4), 0 0 80px rgba(80,80,160,0.2); } }
  .sub { font-size: 10px; letter-spacing: 0.5em; color: rgba(100,100,150,0.3); text-transform: uppercase; margin-top: 14px; font-family: "Segoe UI", sans-serif; animation: flicker 7s ease-in-out infinite; }
  @keyframes flicker { 0%,96%,100%{opacity:0.3;} 97%{opacity:0;} 98%{opacity:0.6;} 99%{opacity:0.1;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Horror</p>
  <h1 class="title">VOID</h1>
  <p class="sub">Whisper</p>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = 800; c.height = 480;
const W = c.width, H = c.height;
let t = 0;
const wisps = Array.from({length: 8}, (_, i) => ({
  x: W*0.2 + Math.random()*W*0.6, y: H*0.3 + Math.random()*H*0.4,
  r: 40 + Math.random()*60, phase: Math.random()*Math.PI*2,
  vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.15
}));
function draw() {
  t += 0.008;
  ctx.fillStyle = 'rgba(1,1,1,0.12)';
  ctx.fillRect(0, 0, W, H);
  wisps.forEach(w => {
    w.x += w.vx + Math.sin(t*0.3+w.phase)*0.3;
    w.y += w.vy + Math.cos(t*0.25+w.phase)*0.2;
    if(w.x<0||w.x>W) w.vx*=-1;
    if(w.y<0||w.y>H) w.vy*=-1;
    const alpha = (0.04 + Math.sin(t+w.phase)*0.02);
    const r = w.r + Math.sin(t*0.5+w.phase)*20;
    const grad = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, r);
    grad.addColorStop(0, `rgba(150,150,220,${alpha*3})`);
    grad.addColorStop(0.4, `rgba(100,100,180,${alpha})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, Math.PI*2); ctx.fill();
  });
  if(Math.random() < 0.003) {
    ctx.fillStyle = `rgba(200,200,255,${Math.random()*0.06})`;
    ctx.fillRect(0, Math.random()*H, W, 2);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
