<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plasma Bars</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #06020e; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #06020e; }
  .bars { position: absolute; bottom: 0; left: 0; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 0 40px; height: 160px; }
  .bar { flex: 1; max-width: 16px; border-radius: 3px 3px 0 0; background: linear-gradient(to top, rgba(160,0,255,0.8), rgba(200,100,255,0.4)); animation: bar-rise 1.6s ease-out forwards, bar-pulse 2s ease-in-out infinite 1.6s; }
  .bar:nth-child(1) { animation-delay: 0.0s, 1.6s; }
  .bar:nth-child(2) { animation-delay: 0.1s, 1.7s; }
  .bar:nth-child(3) { animation-delay: 0.2s, 1.8s; }
  .bar:nth-child(4) { animation-delay: 0.3s, 1.9s; }
  .bar:nth-child(5) { animation-delay: 0.15s, 1.75s; }
  .bar:nth-child(6) { animation-delay: 0.05s, 1.65s; }
  .bar:nth-child(7) { animation-delay: 0.25s, 1.85s; }
  .bar:nth-child(8) { animation-delay: 0.1s, 1.7s; }
  @keyframes bar-rise { from { height: 0; opacity: 0; } to { opacity: 1; } }
  .bar:nth-child(1) { height: 60px; }
  .bar:nth-child(2) { height: 100px; }
  .bar:nth-child(3) { height: 130px; }
  .bar:nth-child(4) { height: 90px; }
  .bar:nth-child(5) { height: 140px; }
  .bar:nth-child(6) { height: 110px; }
  .bar:nth-child(7) { height: 80px; }
  .bar:nth-child(8) { height: 50px; }
  @keyframes bar-pulse { 0%,100% { filter: brightness(0.8); } 50% { filter: brightness(1.3) drop-shadow(0 0 6px rgba(180,50,255,0.6)); } }
  .content { position: relative; z-index: 2; text-align: center; margin-bottom: 80px; animation: rise-in 1.0s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(180,80,255,0.4); margin-bottom: 12px; }
  .title { font-size: 44px; font-weight: 300; letter-spacing: 0.24em; color: rgba(220,180,255,0.92); animation: title-glow 2s ease-in-out infinite; }
  @keyframes title-glow { 0%,100% { text-shadow: 0 0 20px rgba(160,0,255,0.3); } 50% { text-shadow: 0 0 40px rgba(160,0,255,0.6), 0 0 80px rgba(200,100,255,0.2); } }
  .divider { width: 24px; height: 1px; background: rgba(180,80,255,0.4); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(180,80,255,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="bars">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
  <div class="content"><p class="label">Loading</p><h1 class="title">PLASMA</h1><div class="divider"></div><p class="sub">Bars</p></div>
</div>
</body>
</html>
