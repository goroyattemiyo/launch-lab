<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Indigo Pulse</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #03020d; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #03020d; }
  .ring { position: absolute; border-radius: 50%; animation: pulse-ring 4s ease-in-out infinite; }
  .ring-1 { width: 320px; height: 320px; border: 1px solid rgba(80,60,200,0.15); animation-delay: 0s; }
  .ring-2 { width: 240px; height: 240px; border: 1px solid rgba(100,80,220,0.18); animation-delay: 0.8s; }
  .ring-3 { width: 160px; height: 160px; border: 1px solid rgba(120,100,240,0.22); animation-delay: 1.6s; }
  @keyframes pulse-ring { 0%,100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.05); opacity: 1; } }
  .glow { position: absolute; border-radius: 50%; filter: blur(30px); animation: glow-pulse 4s ease-in-out infinite; }
  .glow-1 { width: 180px; height: 180px; background: radial-gradient(circle, rgba(80,60,200,0.15), transparent 70%); }
  .glow-2 { width: 80px; height: 80px; background: radial-gradient(circle, rgba(120,100,240,0.3), transparent 70%); }
  @keyframes glow-pulse { 0%,100% { transform: scale(0.92); opacity: 0.6; } 50% { transform: scale(1.08); opacity: 1; } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 1.4s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(20px) scale(0.97); } to { opacity:1; transform: translateY(0) scale(1); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(120,100,240,0.4); margin-bottom: 12px; }
  .title { font-size: 42px; font-weight: 200; letter-spacing: 0.32em; color: rgba(200,195,255,0.9); animation: title-pulse 4s ease-in-out infinite; }
  @keyframes title-pulse { 0%,100% { text-shadow: 0 0 24px rgba(80,60,200,0.2); } 50% { text-shadow: 0 0 50px rgba(80,60,200,0.5), 0 0 90px rgba(60,40,180,0.2); } }
  .divider { width: 30px; height: 1px; background: linear-gradient(90deg, transparent, rgba(120,100,240,0.4), transparent); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(120,100,240,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="glow glow-1"></div><div class="glow glow-2"></div>
  <div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
  <div class="content"><p class="label">Portfolio</p><h1 class="title">INDIGO</h1><div class="divider"></div><p class="sub">Pulse</p></div>
</div>
</body>
</html>
