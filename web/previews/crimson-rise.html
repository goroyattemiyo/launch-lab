<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crimson Rise</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0404; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #0d0404; }
  .ring { position: absolute; border-radius: 50%; animation: pulse-ring 2.8s ease-in-out infinite; }
  .ring-1 { width: 340px; height: 340px; border: 1px solid rgba(220,30,30,0.15); animation-delay: 0s; }
  .ring-2 { width: 250px; height: 250px; border: 1px solid rgba(255,60,60,0.2); animation-delay: 0.5s; }
  .ring-3 { width: 160px; height: 160px; border: 1px solid rgba(255,100,100,0.25); animation-delay: 1s; }
  @keyframes pulse-ring { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.07); opacity: 1; } }
  .glow-core { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, rgba(255,60,30,0.6), rgba(200,20,20,0.2) 50%, transparent); animation: core-pulse 2.8s ease-in-out infinite; }
  @keyframes core-pulse { 0%,100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.2); opacity: 1; } }
  .ember { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,80,30,0.8); animation: ember-float 3s ease-in-out infinite; }
  .e1 { top: 42%; left: 22%; animation-delay: 0s; }
  .e2 { top: 55%; right: 24%; animation-delay: 0.8s; }
  .e3 { top: 35%; right: 32%; animation-delay: 1.6s; }
  .e4 { bottom: 32%; left: 38%; animation-delay: 0.4s; }
  @keyframes ember-float { 0% { transform: translateY(0) scale(1); opacity: 0.8; } 50% { transform: translateY(-20px) scale(1.3); opacity: 1; } 100% { transform: translateY(-40px) scale(0); opacity: 0; } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 1.0s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: scale(1.1); } to { opacity:1; transform: scale(1); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,60,30,0.45); margin-bottom: 12px; }
  .title { font-size: 44px; font-weight: 700; letter-spacing: 0.18em; color: rgba(255,200,180,0.95); animation: title-pulse 2.8s ease-in-out infinite; }
  @keyframes title-pulse { 0%,100% { text-shadow: 0 0 20px rgba(255,60,30,0.3); } 50% { text-shadow: 0 0 40px rgba(255,60,30,0.7), 0 0 80px rgba(200,20,20,0.3); } }
  .divider { width: 24px; height: 1px; background: rgba(255,60,30,0.4); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(255,120,80,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
  <div class="glow-core"></div>
  <div class="ember e1"></div><div class="ember e2"></div><div class="ember e3"></div><div class="ember e4"></div>
  <div class="content"><p class="label">Game Start</p><h1 class="title">CRIMSON</h1><div class="divider"></div><p class="sub">Rise</p></div>
</div>
</body>
</html>
