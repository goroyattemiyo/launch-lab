<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maple Fall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0806; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(16px, 3.5vw, 24px); color: #e8c090; letter-spacing: 0.4em; opacity: 0; animation: fadeIn 1s 1.5s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Maple Fall</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
let t = 0;
const leaves = [];

function makeLeaf() {
  return {
    x: Math.random() * W,
    y: -20,
    vx: (Math.random() - 0.5) * 1.5,
    vy: 0.8 + Math.random() * 1.2,
    rot: Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.08,
    scale: 0.4 + Math.random() * 0.6,
    hue: 5 + Math.random() * 25, // 赤〜オレンジ
    sat: 70 + Math.random() * 30,
    lit: 35 + Math.random() * 25,
    alpha: 0,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.03 + Math.random() * 0.02,
  };
}

function drawMapleLeaf(x, y, rot, scale, h, s, l, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  const r = 12;
  ctx.fillStyle = `hsl(${h},${s}%,${l}%)`;
  ctx.strokeStyle = `hsl(${h},${s}%,${l * 0.6}%)`;
  ctx.lineWidth = 0.5;

  // もみじの5枚葉（簡略版）
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(
      Math.cos(a - 0.3) * r * 0.7, Math.sin(a - 0.3) * r * 0.7,
      Math.cos(a) * r, Math.sin(a) * r
    );
    ctx.quadraticCurveTo(
      Math.cos(a + 0.3) * r * 0.7, Math.sin(a + 0.3) * r * 0.7,
      0, 0
    );
    ctx.fill();
    ctx.stroke();
  }
  // 茎
  ctx.strokeStyle = `hsl(${h},${s * 0.6}%,${l * 0.5}%)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, r * 0.8);
  ctx.stroke();

  ctx.restore();
}

for (let i = 0; i < 18; i++) {
  const l = makeLeaf();
  l.y = Math.random() * H;
  l.alpha = Math.random() * 0.7;
  leaves.push(l);
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  t++;

  if (t % 8 === 0 && leaves.length < 35) leaves.push(makeLeaf());

  leaves.forEach((l, i) => {
    l.wobble += l.wobbleSpeed;
    l.vx = (Math.random() - 0.5) * 0.3 + Math.sin(l.wobble) * 0.8;
    l.x += l.vx;
    l.y += l.vy;
    l.rot += l.rotV;
    l.alpha = Math.min(0.85, l.alpha + 0.03);

    if (l.y > H + 30) {
      leaves.splice(i, 1);
    } else {
      drawMapleLeaf(l.x, l.y, l.rot, l.scale, l.hue, l.sat, l.lit, l.alpha);
    }
  });

  if (t < 350) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
