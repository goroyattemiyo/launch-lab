<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Washi Tear</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0ebe0; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(18px, 4vw, 28px); color: #1a1408; letter-spacing: 0.4em; opacity: 0; animation: fadeIn 0.8s 1.8s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Washi Tear</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
const cx = W / 2, cy = H / 2;
let t = 0;

// ---- 破れ口の輪郭を事前生成（固定） ----
const TEAR_SEGS = 48;
const tearShape = Array.from({length: TEAR_SEGS}, (_, i) => {
  const angle = (i / TEAR_SEGS) * Math.PI * 2;
  // 基本円にギザギザを重ねる
  const base = 1.0;
  const big   = 0.18 * Math.sin(i * 1.3 + 0.5);
  const med   = 0.10 * Math.sin(i * 3.1 + 1.2);
  const small2 = 0.06 * Math.sin(i * 7.3 + 2.1);
  return { angle, r: base + big + med + small2 };
});

// 繊維の方向と長さ（破れ口のエッジから出る）
const fiberData = Array.from({length: TEAR_SEGS}, (_, i) => {
  const hasFiber = Math.random() < 0.55;
  return {
    has: hasFiber,
    len: 6 + Math.random() * 18,
    curve: (Math.random() - 0.5) * 0.4,
    width: 0.4 + Math.random() * 0.8,
    alpha: 0.3 + Math.random() * 0.5,
  };
});

function easeOutBack(x) {
  const c1 = 1.5, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

function getTearR(progress) {
  return Math.min(W, H) * 0.32 * Math.min(1.0, progress);
}

function drawScene(tearProgress) {
  const tearR = getTearR(tearProgress);
  const animP = Math.min(1, tearProgress);

  // ---- 背景（暗い奥行き）が破れ口から見える ----
  ctx.fillStyle = '#0a0806';
  ctx.fillRect(0, 0, W, H);

  // 破れ口の奥に光（ドラマティックな効果）
  if (animP > 0.1) {
    const innerGlowAlpha = (animP - 0.1) / 0.9;
    const ig = ctx.createRadialGradient(cx, cy, 0, cx, cy, tearR * 1.1);
    ig.addColorStop(0,   `rgba(255,245,220,${innerGlowAlpha * 0.55})`);
    ig.addColorStop(0.4, `rgba(240,225,190,${innerGlowAlpha * 0.35})`);
    ig.addColorStop(1,   'rgba(200,180,140,0)');
    ctx.fillStyle = ig;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- 和紙（破れた後の残り部分）を描く ----
  ctx.save();

  // 和紙のパスを作成（全体から破れ口を除いた形）
  ctx.beginPath();
  ctx.rect(0, 0, W, H);   // 外枠

  // 破れ口の形（時計回りで穴を開ける）
  const firstPt = tearShape[0];
  ctx.moveTo(
    cx + Math.cos(firstPt.angle) * tearR * firstPt.r,
    cy + Math.sin(firstPt.angle) * tearR * firstPt.r
  );
  for (let i = 1; i <= TEAR_SEGS; i++) {
    const pt = tearShape[i % TEAR_SEGS];
    const x = cx + Math.cos(pt.angle) * tearR * pt.r;
    const y = cy + Math.sin(pt.angle) * tearR * pt.r;
    ctx.lineTo(x, y);
  }
  ctx.closePath();

  // 和紙テクスチャのクリップ
  ctx.clip('evenodd');

  // 和紙のベース
  const washiG = ctx.createRadialGradient(cx * 0.85, cy * 0.75, 0, cx, cy, Math.max(W,H) * 0.8);
  washiG.addColorStop(0,   '#f8f2e4');
  washiG.addColorStop(0.5, '#f0ebe0');
  washiG.addColorStop(1,   '#e4ddd0');
  ctx.fillStyle = washiG;
  ctx.fillRect(0, 0, W, H);

  // 和紙の繊維テクスチャ
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 100; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const a = Math.random() * Math.PI;
    const l = 15 + Math.random() * 50;
    ctx.strokeStyle = '#7a6a50'; ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 破れ口の周辺に落ちる影（和紙の厚みと立体感）
  for (let pass = 0; pass < 3; pass++) {
    const shadowR = tearR * (1.02 + pass * 0.06);
    const shadowAlpha = animP * (0.22 - pass * 0.06);
    const sg = ctx.createRadialGradient(cx, cy, tearR * 0.88, cx, cy, shadowR);
    sg.addColorStop(0,   `rgba(0,0,0,0)`);
    sg.addColorStop(0.6, `rgba(0,0,0,${shadowAlpha * 0.5})`);
    sg.addColorStop(1,   `rgba(0,0,0,${shadowAlpha})`);
    ctx.fillStyle = sg;
    ctx.beginPath();
    for (let i = 0; i < TEAR_SEGS; i++) {
      const pt = tearShape[i];
      const x = cx + Math.cos(pt.angle) * shadowR * pt.r;
      const y = cy + Math.sin(pt.angle) * shadowR * pt.r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();

  // ---- エッジの繊維（破れ面のケバ立ち）----
  if (animP > 0.15) {
    ctx.save();
    for (let i = 0; i < TEAR_SEGS; i++) {
      const fd = fiberData[i];
      if (!fd.has) continue;
      const pt = tearShape[i];
      const ex = cx + Math.cos(pt.angle) * tearR * pt.r;
      const ey = cy + Math.sin(pt.angle) * tearR * pt.r;
      const fiberAlpha = fd.alpha * Math.min(1, (animP - 0.15) / 0.35);
      ctx.strokeStyle = `rgba(160,140,110,${fiberAlpha})`;
      ctx.lineWidth = fd.width;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      // 外側に向かってカーブして伸びる
      const fAngle = pt.angle + fd.curve;
      ctx.quadraticCurveTo(
        ex + Math.cos(fAngle) * fd.len * 0.5,
        ey + Math.sin(fAngle) * fd.len * 0.5,
        ex + Math.cos(fAngle) * fd.len,
        ey + Math.sin(fAngle) * fd.len
      );
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- 破れ口のエッジライン（和紙の断面）----
  if (animP > 0.05) {
    ctx.save();
    ctx.strokeStyle = `rgba(200,185,160,${animP * 0.7})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    tearShape.forEach((pt, i) => {
      const x = cx + Math.cos(pt.angle) * tearR * pt.r;
      const y = cy + Math.sin(pt.angle) * tearR * pt.r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  t++;

  let tearP = 0;
  if (t < 15) tearP = 0;
  else if (t < 95) tearP = easeOutBack(Math.min(1, (t - 15) / 80));
  else tearP = 1;

  drawScene(tearP);

  if (t < 350) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
