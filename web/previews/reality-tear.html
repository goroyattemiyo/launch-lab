<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reality Tear</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020202; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: Georgia, serif; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-bottom: 12px; font-family: "Segoe UI", sans-serif; }
  .title { font-size: 44px; font-weight: 100; letter-spacing: 0.35em; color: rgba(255,255,255,0.88); animation: tear-shift 6s ease-in-out infinite; }
  @keyframes tear-shift { 0%,100%{clip-path:inset(0 0 0 0);} 45%{clip-path:inset(20% 0 30% 0);transform:translateX(-5px);} 50%{clip-path:inset(0 0 0 0);transform:translateX(5px);} 55%{clip-path:inset(40% 0 10% 0);transform:translateX(-3px);} 60%{clip-path:inset(0 0 0 0);transform:translateX(0);} }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(255,255,255,0.18); text-transform: uppercase; margin-top: 12px; font-family: "Segoe UI", sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Glitch</p>
  <h1 class="title">REALITY</h1>
  <p class="sub">Tear</p>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=800;c.height=480;
const W=c.width,H=c.height;
let t=0;
const tears=[];
function addTear(){
  const x=W*0.3+Math.random()*W*0.4;
  tears.push({x,y:0,len:H,width:1+Math.random()*3,alpha:0.6+Math.random()*0.4,
    offset:Math.random()*20-10,speed:0.5+Math.random()*1,hue:Math.random()*360});
}
for(let i=0;i<6;i++) addTear();
function draw(){
  t+=0.015;
  ctx.fillStyle='rgba(2,2,2,0.1)';
  ctx.fillRect(0,0,W,H);
  tears.forEach((tear,i)=>{
    tear.offset=Math.sin(t*tear.speed+i)*15;
    const grad=ctx.createLinearGradient(tear.x,0,tear.x,H);
    grad.addColorStop(0,'transparent');
    grad.addColorStop(0.3,`hsla(${tear.hue},80%,70%,${tear.alpha*0.5})`);
    grad.addColorStop(0.5,`hsla(${tear.hue},100%,80%,${tear.alpha})`);
    grad.addColorStop(0.7,`hsla(${(tear.hue+120)%360},80%,70%,${tear.alpha*0.5})`);
    grad.addColorStop(1,'transparent');
    ctx.strokeStyle=grad;
    ctx.lineWidth=tear.width;
    ctx.beginPath();
    for(let y=0;y<H;y+=4){
      const wx=tear.x+Math.sin(y*0.02+t)*tear.offset;
      y===0?ctx.moveTo(wx,y):ctx.lineTo(wx,y);
    }
    ctx.stroke();
    tear.hue=(tear.hue+0.5)%360;
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
