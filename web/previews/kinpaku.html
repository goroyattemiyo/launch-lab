<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinpaku</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080604; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(18px, 4vw, 28px); color: #f0d060; letter-spacing: 0.4em; opacity: 0; animation: fadeIn 1s 2s forwards; text-shadow: 0 0 20px rgba(200,150,30,0.6); }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">金　Kinpaku</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
const cx = W / 2, cy = H / 2;
let t = 0;

// 金箔のフレーク
const flakes = [];
const FLAKE_COUNT = 60;

for (let i = 0; i < FLAKE_COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.min(W, H) * (0.05 + Math.random() * 0.28);
  flakes.push({
    x: cx + Math.cos(angle) * dist * 0.3,
    y: cy + Math.sin(angle) * dist * 0.3,
    tx: cx + Math.cos(angle) * dist * 1.8,    // 飛散先
    ty: cy + Math.sin(angle) * dist * 1.5 + H * 0.2,
    w: 6 + Math.random() * 18,
    h: 3 + Math.random() * 10,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.15,
    delay: Math.random() * 0.5,
    alpha: 1,
    hue: 42 + Math.random() * 12,
    sat: 80 + Math.random() * 20,
    lit: 52 + Math.random() * 20,
  });
}

function drawFlake(f, progress) {
  const p = Math.max(0, Math.min(1, (progress - f.delay) / (1 - f.delay)));
  const ep = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  const x = f.x + (f.tx - f.x) * ep;
  const y = f.y + (f.ty - f.y) * ep;
  const rot = f.rot + f.rotSpeed * p * 60;
  const alpha = p < 0.7 ? 1 : 1 - (p - 0.7) / 0.3;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;

  // 金箔の光沢グラデーション
  const fg = ctx.createLinearGradient(-f.w / 2, -f.h / 2, f.w / 2, f.h / 2);
  fg.addColorStop(0, `hsl(${f.hue - 5},${f.sat}%,${f.lit - 10}%)`);
  fg.addColorStop(0.3, `hsl(${f.hue},${f.sat}%,${f.lit + 15}%)`);
  fg.addColorStop(0.6, `hsl(${f.hue + 5},${f.sat}%,${f.lit}%)`);
  fg.addColorStop(1, `hsl(${f.hue},${f.sat - 10}%,${f.lit - 8}%)`);
  ctx.fillStyle = fg;

  // 不規則な多角形（箔っぽい形）
  ctx.beginPath();
  ctx.moveTo(-f.w / 2, -f.h * 0.2);
  ctx.lineTo(-f.w * 0.3, -f.h / 2);
  ctx.lineTo(f.w * 0.2, -f.h / 2);
  ctx.lineTo(f.w / 2, f.h * 0.1);
  ctx.lineTo(f.w * 0.3, f.h / 2);
  ctx.lineTo(-f.w * 0.1, f.h / 2);
  ctx.lineTo(-f.w / 2, f.h * 0.2);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// 中央の輝き（金箔が剥がれた後に残る光）
function drawCenter(progress) {
  const p = Math.max(0, Math.min(1, (progress - 0.3) / 0.7));
  if (p <= 0) return;

  const r = Math.min(W, H) * 0.2 * p;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, `rgba(240,200,60,${p * 0.35})`);
  g.addColorStop(0.4, `rgba(200,150,30,${p * 0.2})`);
  g.addColorStop(1, 'rgba(200,150,30,0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  t++;

  const progress = Math.min(1, t / 120);

  // 金箔が覆う（最初は全面）
  if (progress < 0.1) {
    const coverAlpha = 1 - progress / 0.1;
    ctx.fillStyle = `rgba(200,160,40,${coverAlpha * 0.85})`;
    ctx.fillRect(0, 0, W, H);
  }

  drawCenter(progress);

  flakes.forEach(f => drawFlake(f, progress));

  // 細かい金の粒子
  if (t < 150) {
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = Math.random() * Math.min(W, H) * 0.3;
      const px = cx + Math.cos(a) * d * progress;
      const py = cy + Math.sin(a) * d * progress;
      ctx.fillStyle = `rgba(240,200,80,${Math.random() * 0.5})`;
      ctx.beginPath();
      ctx.arc(px, py, Math.random() * 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (t < 350) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
