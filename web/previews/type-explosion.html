<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Type Explosion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: "Arial Black", sans-serif; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 12px; font-family: "Segoe UI", sans-serif; }
  .title { font-size: 52px; font-weight: 900; letter-spacing: -0.02em; color: white; animation: explode-pulse 1.5s ease-in-out infinite; }
  @keyframes explode-pulse { 0%,100%{letter-spacing:-0.02em;} 50%{letter-spacing:0.08em;} }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(255,255,255,0.25); text-transform: uppercase; margin-top: 12px; font-family: "Segoe UI", sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Typography</p>
  <h1 class="title">BOOM</h1>
  <p class="sub">Type Explosion</p>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=800;c.height=480;
const W=c.width,H=c.height;
let t=0;
const letters=[];
const BASE='TYPEEXPLOSION';
function burst(){
  BASE.split('').forEach((ch,i)=>{
    const angle=Math.random()*Math.PI*2;
    const speed=2+Math.random()*5;
    letters.push({ch,x:W/2,y:H/2,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-3,
      size:16+Math.random()*24,alpha:1,hue:Math.random()*360,rot:Math.random()*Math.PI*2,vrot:(Math.random()-0.5)*0.2});
  });
}
burst();
setInterval(burst,2000);
function draw(){
  t++;
  ctx.fillStyle='rgba(5,5,5,0.15)';
  ctx.fillRect(0,0,W,H);
  letters.forEach((l,i)=>{
    l.x+=l.vx; l.y+=l.vy; l.vy+=0.12; l.alpha-=0.008; l.rot+=l.vrot;
    if(l.alpha<=0){letters.splice(i,1);return;}
    ctx.save();
    ctx.translate(l.x,l.y);
    ctx.rotate(l.rot);
    ctx.globalAlpha=l.alpha;
    ctx.fillStyle=`hsl(${l.hue},80%,65%)`;
    ctx.font=`900 ${l.size}px Arial Black`;
    ctx.textAlign='center';
    ctx.fillText(l.ch,0,0);
    ctx.restore();
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
