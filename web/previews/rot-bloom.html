<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rot Bloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020300; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: Georgia, serif; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(80,120,20,0.4); margin-bottom: 12px; font-family: "Segoe UI", sans-serif; }
  .title { font-size: 44px; font-weight: 400; letter-spacing: 0.2em; color: rgba(160,200,80,0.75); animation: rot-pulse 4s ease-in-out infinite; }
  @keyframes rot-pulse { 0%,100% { text-shadow: 0 0 20px rgba(80,160,0,0.3); filter: hue-rotate(0deg); } 50% { text-shadow: 0 0 40px rgba(100,180,0,0.5); filter: hue-rotate(20deg); } }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(80,120,20,0.35); text-transform: uppercase; margin-top: 12px; font-family: "Segoe UI", sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Horror</p>
  <h1 class="title">ROT</h1>
  <p class="sub">Bloom</p>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = 800; c.height = 480;
const W = c.width, H = c.height;
let t = 0;
const spores = Array.from({length: 60}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  r: 2+Math.random()*6, vx:(Math.random()-0.5)*0.3, vy:-0.1-Math.random()*0.3,
  hue: 80+Math.random()*40, alpha: 0.3+Math.random()*0.4, phase: Math.random()*Math.PI*2
}));
function draw() {
  t += 0.01;
  ctx.fillStyle = 'rgba(2,3,0,0.08)';
  ctx.fillRect(0,0,W,H);
  const grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,200);
  grad.addColorStop(0,`rgba(30,60,0,${0.08+Math.sin(t)*0.03})`);
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  spores.forEach(s => {
    s.x += s.vx + Math.sin(t*0.5+s.phase)*0.4;
    s.y += s.vy;
    s.r += 0.01;
    if(s.y < -10 || s.r > 15) {
      s.x=Math.random()*W; s.y=H+10; s.r=2+Math.random()*4; s.vy=-0.1-Math.random()*0.3;
    }
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${s.hue+Math.sin(t)*10},70%,35%,${s.alpha*0.5})`;
    ctx.fill();
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*0.4,0,Math.PI*2);
    ctx.fillStyle=`hsla(${s.hue+20},80%,50%,${s.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
