<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glass Entry</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #09090b;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 320px;
    min-height: 480px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(135deg, #0a0a0f 0%, #0d0d18 50%, #0a0a0f 100%);
  }

  /* 背景：ガラス板 */
  .glass-bg {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.03) 0%,
        rgba(255,255,255,0.07) 40%,
        rgba(255,255,255,0.02) 60%,
        rgba(255,255,255,0.05) 100%
      );
  }

  /* メインのsweep光帯 */
  .sweep {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      105deg,
      transparent 0%,
      transparent 30%,
      rgba(255,255,255,0.0) 38%,
      rgba(255,255,255,0.18) 44%,
      rgba(255,255,255,0.32) 48%,
      rgba(255,255,255,0.18) 52%,
      rgba(255,255,255,0.0) 58%,
      transparent 66%,
      transparent 100%
    );
    transform: translateX(-120%);
    animation: sweep-main 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  /* 細い2本目の光帯 */
  .sweep-thin {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      105deg,
      transparent 0%,
      transparent 40%,
      rgba(180,220,255,0.0) 46%,
      rgba(180,220,255,0.12) 49%,
      rgba(180,220,255,0.22) 51%,
      rgba(180,220,255,0.12) 53%,
      rgba(180,220,255,0.0) 56%,
      transparent 62%,
      transparent 100%
    );
    transform: translateX(-120%);
    animation: sweep-main 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    animation-delay: 0.18s;
  }

  @keyframes sweep-main {
    0%   { transform: translateX(-120%); }
    60%  { transform: translateX(120%); }
    100% { transform: translateX(120%); }
  }

  /* ガラスエッジのハイライト（上辺） */
  .edge-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,255,255,0.0) 10%,
      rgba(255,255,255,0.4) 50%,
      rgba(255,255,255,0.0) 90%,
      transparent 100%
    );
    animation: edge-fade 3.5s ease-in-out infinite;
  }

  .edge-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,255,255,0.0) 10%,
      rgba(255,255,255,0.15) 50%,
      rgba(255,255,255,0.0) 90%,
      transparent 100%
    );
    animation: edge-fade 3.5s ease-in-out infinite;
  }

  @keyframes edge-fade {
    0%, 20%  { opacity: 0; }
    45%      { opacity: 1; }
    70%, 100%{ opacity: 0; }
  }

  /* コーナーのアクセント */
  .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    opacity: 0;
    animation: corner-appear 3.5s ease-in-out infinite;
  }
  .corner-tl { top: 24px; left: 24px; border-top: 1px solid rgba(255,255,255,0.5); border-left: 1px solid rgba(255,255,255,0.5); }
  .corner-tr { top: 24px; right: 24px; border-top: 1px solid rgba(255,255,255,0.5); border-right: 1px solid rgba(255,255,255,0.5); }
  .corner-bl { bottom: 24px; left: 24px; border-bottom: 1px solid rgba(255,255,255,0.5); border-left: 1px solid rgba(255,255,255,0.5); }
  .corner-br { bottom: 24px; right: 24px; border-bottom: 1px solid rgba(255,255,255,0.5); border-right: 1px solid rgba(255,255,255,0.5); }

  @keyframes corner-appear {
    0%, 25% { opacity: 0; transform: scale(0.7); }
    50%     { opacity: 1; transform: scale(1); }
    80%, 100%{ opacity: 0; transform: scale(1); }
  }

  /* 中央コンテンツ */
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    opacity: 0;
    animation: content-rise 3.5s ease-in-out infinite;
  }

  @keyframes content-rise {
    0%, 30%  { opacity: 0; transform: translateY(12px); }
    55%      { opacity: 1; transform: translateY(0); }
    80%, 100%{ opacity: 0; transform: translateY(-4px); }
  }

  .label {
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(180,220,255,0.6);
    margin-bottom: 14px;
  }

  .title {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.92);
    line-height: 1;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    margin: 16px auto;
  }

  .sub {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  /* 底面の反射 */
  .reflection {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(
      to top,
      rgba(180,220,255,0.04) 0%,
      transparent 100%
    );
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glass-bg"></div>
  <div class="reflection"></div>

  <div class="sweep"></div>
  <div class="sweep-thin"></div>

  <div class="edge-top"></div>
  <div class="edge-bottom"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="content">
    <p class="label">Luxury</p>
    <h1 class="title">GLASS</h1>
    <div class="divider"></div>
    <p class="sub">Entry</p>
  </div>
</div>
</body>
</html>
