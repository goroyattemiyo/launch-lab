<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Collapse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #040404; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: "Segoe UI", sans-serif; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .ui { position: relative; z-index: 2; text-align: center; }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 12px; }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(255,255,255,0.2); text-transform: uppercase; margin-top: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <p class="label">Typography</p>
  <p class="sub">Word Collapse</p>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=800;c.height=480;
const W=c.width,H=c.height;
const WORDS=['WORD','COLLAPSE','REBUILD','CHAOS','ORDER'];
let phase=0,t=0,wordIdx=0;
let chars=[];
function buildWord(){
  chars=[];
  const word=WORDS[wordIdx%WORDS.length];
  const totalW=word.length*50;
  word.split('').forEach((ch,i)=>{
    chars.push({ch,tx:W/2-totalW/2+i*50+25,ty:H/2,x:Math.random()*W,y:Math.random()*H,
      alpha:0,size:44,hue:30+i*20});
  });
  phase=0; t=0;
}
buildWord();
function draw(){
  t++;
  ctx.fillStyle='rgba(4,4,4,0.12)';
  ctx.fillRect(0,0,W,H);
  if(phase===0){
    chars.forEach(ch=>{
      ch.x+=(ch.tx-ch.x)*0.06;
      ch.y+=(ch.ty-ch.y)*0.06;
      ch.alpha=Math.min(1,ch.alpha+0.03);
    });
    if(t>80) phase=1;
  } else if(phase===1){
    chars.forEach(ch=>{
      ch.ty+=3+Math.random()*2;
      ch.alpha-=0.02;
    });
    if(t>130){wordIdx++;buildWord();}
  }
  chars.forEach(ch=>{
    ctx.globalAlpha=ch.alpha;
    ctx.fillStyle=`hsl(${ch.hue},70%,65%)`;
    ctx.font=`200 ${ch.size}px Arial`;
    ctx.textAlign='center';
    ctx.fillText(ch.ch,ch.x,ch.y);
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
