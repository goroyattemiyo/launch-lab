<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Drift</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #020b12; display: grid; place-items: center; min-height: 100vh; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #020b12; }
  .aurora { position: absolute; border-radius: 50%; filter: blur(40px); animation: aurora-float 4s ease-in-out infinite; }
  .aurora-1 { width: 300px; height: 120px; background: radial-gradient(ellipse, rgba(0,255,180,0.18), transparent 70%); top: 30%; left: 10%; animation-delay: 0s; }
  .aurora-2 { width: 260px; height: 100px; background: radial-gradient(ellipse, rgba(0,180,255,0.15), transparent 70%); top: 40%; right: 5%; animation-delay: 1.2s; }
  .aurora-3 { width: 200px; height: 80px; background: radial-gradient(ellipse, rgba(100,255,200,0.12), transparent 70%); bottom: 25%; left: 30%; animation-delay: 2.4s; }
  @keyframes aurora-float { 0%,100% { transform: translateY(0) scaleX(1); opacity: 0.7; } 50% { transform: translateY(-18px) scaleX(1.1); opacity: 1; } }
  .ring { position: absolute; border-radius: 50%; animation: pulse-ring 3.5s ease-in-out infinite; }
  .ring-1 { width: 320px; height: 320px; border: 1px solid rgba(0,255,180,0.1); animation-delay: 0s; }
  .ring-2 { width: 230px; height: 230px; border: 1px solid rgba(0,200,255,0.12); animation-delay: 0.6s; }
  @keyframes pulse-ring { 0%,100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.05); opacity: 0.9; } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 1.4s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(0,255,180,0.4); margin-bottom: 12px; font-family: "Segoe UI", sans-serif; }
  .title { font-size: 42px; font-weight: 300; letter-spacing: 0.22em; color: rgba(200,255,240,0.9); font-family: Georgia, serif; animation: title-glow 3.5s ease-in-out infinite; }
  @keyframes title-glow { 0%,100% { text-shadow: 0 0 24px rgba(0,255,180,0.2); } 50% { text-shadow: 0 0 48px rgba(0,255,180,0.5), 0 0 80px rgba(0,200,255,0.2); } }
  .divider { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,255,180,0.5), transparent); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(0,200,255,0.35); text-transform: uppercase; font-family: "Segoe UI", sans-serif; }
</style>
</head>
<body>
<div class="stage">
  <div class="aurora aurora-1"></div><div class="aurora aurora-2"></div><div class="aurora aurora-3"></div>
  <div class="ring ring-1"></div><div class="ring ring-2"></div>
  <div class="content"><p class="label">App Launch</p><h1 class="title">AURORA</h1><div class="divider"></div><p class="sub">Drift</p></div>
</div>
</body>
</html>
