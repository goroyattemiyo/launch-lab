<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firefly Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020408; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(16px, 3.5vw, 24px); color: rgba(180,230,140,0.9); letter-spacing: 0.4em; opacity: 0; animation: fadeIn 2s 1s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Firefly Night</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
let t = 0;

const flies = [];
function makeFirefly() {
  return {
    x: Math.random() * W,
    y: H * 0.2 + Math.random() * H * 0.65,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.3,
    phase: Math.random() * Math.PI * 2,
    glowSpeed: 0.04 + Math.random() * 0.04,
    glowPhase: Math.random() * Math.PI * 2,
    r: 2 + Math.random() * 2,
    path: [],
    pathMax: 30,
    drift: Math.random() * Math.PI * 2,
    driftSpeed: 0.01 + Math.random() * 0.01,
    born: t,
  };
}

function loop() {
  // 残像効果
  ctx.fillStyle = 'rgba(2,4,8,0.25)';
  ctx.fillRect(0, 0, W, H);
  t++;

  if (t % 8 === 0 && flies.length < 28) flies.push(makeFirefly());

  flies.forEach((f, i) => {
    f.drift += f.driftSpeed;
    f.vx += Math.sin(f.drift) * 0.015;
    f.vy += Math.cos(f.drift * 1.3) * 0.01;
    // 速度制限
    const speed = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
    if (speed > 0.8) { f.vx *= 0.8 / speed; f.vy *= 0.8 / speed; }

    f.x += f.vx;
    f.y += f.vy;

    // 画面端で折り返し
    if (f.x < 0 || f.x > W) f.vx *= -1;
    if (f.y < H * 0.1 || f.y > H * 0.92) f.vy *= -1;

    // パスの記録
    f.path.push({ x: f.x, y: f.y });
    if (f.path.length > f.pathMax) f.path.shift();

    const age = t - f.born;
    const fadeIn = Math.min(1, age / 40);

    // 発光の点滅
    const glow = (Math.sin(t * f.glowSpeed + f.glowPhase) + 1) / 2;
    const glowAlpha = glow * 0.85 * fadeIn;

    if (glowAlpha < 0.05) return;

    // 軌跡
    if (f.path.length > 2) {
      ctx.save();
      for (let pi = 1; pi < f.path.length; pi++) {
        const ratio = pi / f.path.length;
        ctx.strokeStyle = `rgba(160,230,80,${ratio * glowAlpha * 0.3})`;
        ctx.lineWidth = ratio * 1.5;
        ctx.beginPath();
        ctx.moveTo(f.path[pi - 1].x, f.path[pi - 1].y);
        ctx.lineTo(f.path[pi].x, f.path[pi].y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 光の本体
    const rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 8);
    rg.addColorStop(0, `rgba(220,255,160,${glowAlpha})`);
    rg.addColorStop(0.3, `rgba(160,230,80,${glowAlpha * 0.6})`);
    rg.addColorStop(1, 'rgba(100,200,40,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(f.x - f.r * 8, f.y - f.r * 8, f.r * 16, f.r * 16);

    ctx.fillStyle = `rgba(240,255,200,${glowAlpha})`;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  });

  if (t < 400) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
