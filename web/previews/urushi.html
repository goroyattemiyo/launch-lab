<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urushi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a0404; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(16px, 3.5vw, 24px); color: #f0c890; letter-spacing: 0.5em; opacity: 0; animation: fadeIn 1.5s 2s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">漆　Urushi</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
const cx = W / 2, cy = H / 2;
let t = 0;

function easeInOutCubic(x) {
  return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  t++;

  const rawP = Math.min(1, t / 140);
  const p = easeInOutCubic(rawP);

  // ---- ベース：深い赤黒（漆の地色）----
  const base = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
  base.addColorStop(0,   `rgba(80,8,8,${p})`);
  base.addColorStop(0.35,`rgba(55,5,5,${p})`);
  base.addColorStop(0.7, `rgba(35,3,3,${p})`);
  base.addColorStop(1,   `rgba(18,1,1,${p})`);
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, W, H);

  // ---- 中間層：漆の深み（暗赤色）----
  if (p > 0.15) {
    const depth = ctx.createRadialGradient(cx * 0.6, cy * 0.5, 0, cx, cy, Math.max(W,H) * 0.55);
    depth.addColorStop(0,   `rgba(140,20,15,${(p-0.15)/0.85 * 0.55})`);
    depth.addColorStop(0.45,`rgba(100,12,10,${(p-0.15)/0.85 * 0.35})`);
    depth.addColorStop(1,   `rgba(60,5,5,0)`);
    ctx.fillStyle = depth;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- 光沢ハイライト（漆器の特徴的な映り込み）----
  if (p > 0.3) {
    const glossP = (p - 0.3) / 0.7;

    // メインの光（左上から差し込む）
    const glossX = cx - W * 0.18;
    const glossY = cy - H * 0.28;
    const g1 = ctx.createRadialGradient(glossX, glossY, 0, glossX, glossY, Math.min(W,H) * 0.38);
    g1.addColorStop(0,   `rgba(255,180,140,${glossP * 0.55})`);
    g1.addColorStop(0.25,`rgba(220,100,80, ${glossP * 0.35})`);
    g1.addColorStop(0.6, `rgba(160,40,30,  ${glossP * 0.18})`);
    g1.addColorStop(1,   `rgba(100,10,10,0)`);
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    // 副光沢（右下）
    const g2 = ctx.createRadialGradient(cx + W*0.22, cy + H*0.2, 0, cx + W*0.22, cy + H*0.2, Math.min(W,H)*0.25);
    g2.addColorStop(0,   `rgba(200,60,40,${glossP * 0.25})`);
    g2.addColorStop(1,   'rgba(150,20,15,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    // 鋭い光の筋（漆器の映り込み）
    ctx.save();
    ctx.globalAlpha = glossP * 0.7;
    for (let i = 0; i < 2; i++) {
      const lx1 = cx - W * (0.35 - i * 0.08);
      const ly1 = cy - H * (0.45 - i * 0.05);
      const lx2 = cx + W * (0.15 + i * 0.06);
      const ly2 = cy + H * (0.12 + i * 0.04);
      const lg = ctx.createLinearGradient(lx1, ly1, lx2, ly2);
      lg.addColorStop(0,   'rgba(255,200,160,0)');
      lg.addColorStop(0.35,`rgba(255,200,160,${0.38 - i*0.12})`);
      lg.addColorStop(0.5, `rgba(255,220,180,${0.55 - i*0.15})`);
      lg.addColorStop(0.65,`rgba(255,200,160,${0.38 - i*0.12})`);
      lg.addColorStop(1,   'rgba(255,200,160,0)');
      ctx.fillStyle = lg;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.38 + i * 0.12);
      ctx.fillRect(-W, -6 - i*3, W*2, 12 + i*6);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---- 縁の朱色の発光（蒔絵風）----
  if (p > 0.5) {
    const rimP = (p - 0.5) / 0.5;
    const rimR = Math.min(W, H) * 0.42;
    const rim = ctx.createRadialGradient(cx, cy, rimR * 0.78, cx, cy, rimR);
    rim.addColorStop(0,   'rgba(180,30,20,0)');
    rim.addColorStop(0.55,`rgba(200,40,25,${rimP * 0.22})`);
    rim.addColorStop(0.82,`rgba(220,60,35,${rimP * 0.38})`);
    rim.addColorStop(1,   'rgba(160,20,15,0)');
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.arc(cx, cy, rimR * 1.05, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- 表面の微細な揺らぎ（液体漆の流れ）----
  if (p > 0.2 && p < 0.88) {
    const waveP = (p - 0.2) / 0.68;
    ctx.save();
    ctx.globalAlpha = 0.055 * waveP;
    for (let i = 0; i < 5; i++) {
      const wa = (i / 5) * Math.PI * 2 + t * 0.006 + i * 1.1;
      const wr = Math.min(W,H) * (0.12 + i * 0.06) * p;
      ctx.strokeStyle = `rgba(220,80,50,1)`;
      ctx.lineWidth = 6 + i * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, wr, wa, wa + Math.PI * 0.35);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (t < 380) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
