<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chrome Sweep</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050505; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #050505; }
  .sweep-1 { position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.06) 55%, transparent 75%); animation: sweep 3s cubic-bezier(0.4,0,0.6,1) infinite; animation-delay: 0.3s; }
  .sweep-2 { position: absolute; top: 0; left: -100%; width: 30%; height: 100%; background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%); animation: sweep 3s cubic-bezier(0.4,0,0.6,1) infinite; animation-delay: 0.45s; }
  @keyframes sweep { 0% { left: -100%; } 65%,100% { left: 160%; } }
  .line-h { position: absolute; width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.15) 80%, transparent); top: 38%; animation: line-fade 3s ease-in-out infinite; }
  .line-h2 { top: 62%; animation-delay: 0.2s; }
  @keyframes line-fade { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 1.2s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 12px; }
  .title { font-size: 44px; font-weight: 100; letter-spacing: 0.36em; color: rgba(240,240,240,0.92); animation: title-chrome 3s ease-in-out infinite; }
  @keyframes title-chrome { 0%,100% { text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1); } 50% { text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 40px rgba(255,255,255,0.3); } }
  .divider { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(255,255,255,0.2); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="sweep-1"></div><div class="sweep-2"></div>
  <div class="line-h"></div><div class="line-h line-h2"></div>
  <div class="content"><p class="label">Landing Page</p><h1 class="title">CHROME</h1><div class="divider"></div><p class="sub">Sweep</p></div>
</div>
</body>
</html>
