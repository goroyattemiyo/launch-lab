<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Start Orbit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    min-width: 320px;
    min-height: 480px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #0d0d20 0%, #09090b 70%);
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .ring-1 { width: 280px; height: 280px; animation: ring-pulse 4s ease-in-out infinite; }
  .ring-2 { width: 200px; height: 200px; animation: ring-pulse 4s ease-in-out infinite 0.3s; }
  .ring-3 { width: 340px; height: 340px; animation: ring-pulse 4s ease-in-out infinite 0.6s; }
  @keyframes ring-pulse {
    0%,100% { opacity: 0.4; transform: scale(1); }
    50%     { opacity: 0.9; transform: scale(1.02); }
  }

  .orbit-track {
    position: absolute;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.06);
  }
  .track-1 { width: 260px; height: 260px; }
  .track-2 { width: 180px; height: 180px; }
  .track-3 { width: 320px; height: 320px; }

  .dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    margin: -3px 0 0 -3px;
  }
  /* orbit-1: 260px半径130px */
  .dot-1 {
    background: rgba(120,200,255,0.9);
    box-shadow: 0 0 8px rgba(120,200,255,0.8);
    animation: orbit-1 4s linear infinite;
  }
  .dot-2 {
    width: 4px; height: 4px; margin: -2px 0 0 -2px;
    background: rgba(120,200,255,0.6);
    animation: orbit-1 4s linear infinite 2s;
  }
  /* orbit-2: 180px半径90px */
  .dot-3 {
    width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    background: rgba(200,160,255,0.9);
    box-shadow: 0 0 8px rgba(200,160,255,0.8);
    animation: orbit-2 2.8s linear infinite;
  }
  .dot-4 {
    width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    background: rgba(200,160,255,0.5);
    animation: orbit-2 2.8s linear infinite 1.4s;
  }
  /* orbit-3: 320px半径160px */
  .dot-5 {
    width: 4px; height: 4px; margin: -2px 0 0 -2px;
    background: rgba(255,220,120,0.9);
    box-shadow: 0 0 6px rgba(255,220,120,0.8);
    animation: orbit-3 5.5s linear infinite;
  }

  @keyframes orbit-1 {
    from { transform: rotate(0deg) translateX(130px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(130px) rotate(-360deg); }
  }
  @keyframes orbit-2 {
    from { transform: rotate(60deg) translateX(90px) rotate(-60deg); }
    to   { transform: rotate(420deg) translateX(90px) rotate(-420deg); }
  }
  @keyframes orbit-3 {
    from { transform: rotate(120deg) translateX(160px) rotate(-120deg); }
    to   { transform: rotate(480deg) translateX(160px) rotate(-480deg); }
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: content-in 1s ease-out forwards;
  }
  @keyframes content-in {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .label {
    font-size: 9px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(120,200,255,0.6);
    margin-bottom: 10px;
  }
  .title {
    font-size: 38px;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.9);
  }
  .sub {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
  .glow-core {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120,200,255,0.15), transparent 70%);
    animation: core-pulse 4s ease-in-out infinite;
  }
  @keyframes core-pulse {
    0%,100% { transform: scale(1); opacity: 0.6; }
    50%     { transform: scale(1.4); opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="orbit-track track-1"></div>
  <div class="orbit-track track-2"></div>
  <div class="orbit-track track-3"></div>
  <div class="glow-core"></div>
  <div class="dot dot-1"></div>
  <div class="dot dot-2"></div>
  <div class="dot dot-3"></div>
  <div class="dot dot-4"></div>
  <div class="dot dot-5"></div>
  <div class="content">
    <p class="label">Game Start</p>
    <h1 class="title">ORBIT</h1>
    <p class="sub">Launch Sequence</p>
  </div>
</div>
</body>
</html>
