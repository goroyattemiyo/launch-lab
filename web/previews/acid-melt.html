<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acid Melt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: "Courier New", monospace; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 12px; }
  .title { font-size: 48px; font-weight: 900; letter-spacing: 0.1em; color: white; mix-blend-mode: difference; animation: title-warp 3s ease-in-out infinite; }
  @keyframes title-warp { 0%,100% { transform: skewX(0deg) scale(1); } 50% { transform: skewX(2deg) scale(1.02); } }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-top: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Psychedelic</p>
  <h1 class="title">ACID</h1>
  <p class="sub">Melt</p>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = 800; c.height = 480;
const W = c.width, H = c.height;
let t = 0;
function draw() {
  t += 0.012;
  for (let x = 0; x < W; x += 4) {
    for (let y = 0; y < H; y += 4) {
      const nx = x / W, ny = y / H;
      const v1 = Math.sin(nx * 6 + t);
      const v2 = Math.sin(ny * 6 + t * 0.7);
      const v3 = Math.sin((nx + ny) * 4 + t * 1.3);
      const v4 = Math.sin(Math.sqrt((nx-0.5)**2 + (ny-0.5)**2) * 8 - t * 1.5);
      const v = (v1 + v2 + v3 + v4) / 4;
      const hue = (v * 180 + t * 30) % 360;
      const sat = 80 + v * 20;
      const lit = 40 + v * 20;
      ctx.fillStyle = `hsl(${hue},${sat}%,${lit}%)`;
      ctx.fillRect(x, y, 4, 4);
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
