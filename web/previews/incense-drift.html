<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incense Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080608; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  .title { position: relative; z-index: 10; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(16px, 3.5vw, 24px); color: #d8c8e8; letter-spacing: 0.4em; opacity: 0; animation: fadeIn 1.5s 1s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Incense Drift</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
const W = c.width, H = c.height;
const cx = W/2;
let t = 0;

// 煙のパーティクル
const particles = [];

function addSmoke(x, y) {
  particles.push({
    x, y,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -(0.4 + Math.random() * 0.6),
    r: 3 + Math.random() * 4,
    alpha: 0.3 + Math.random() * 0.3,
    life: 0,
    maxLife: 120 + Math.random() * 80,
    drift: Math.random() * Math.PI * 2,
    driftSpeed: 0.02 + Math.random() * 0.02,
  });
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  t++;

  // 線香の位置
  const stickX = cx;
  const stickY = H * 0.75;
  const tipY = H * 0.68;

  // 線香を描く
  ctx.save();
  ctx.strokeStyle = '#5a3020';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(stickX, stickY);
  ctx.lineTo(stickX, tipY);
  ctx.stroke();
  // 燃焼端の光
  const glowR = 4 + Math.sin(t * 0.1) * 1.5;
  const glowG = ctx.createRadialGradient(stickX, tipY, 0, stickX, tipY, glowR * 3);
  glowG.addColorStop(0, 'rgba(255,120,40,0.8)');
  glowG.addColorStop(0.4, 'rgba(255,80,20,0.4)');
  glowG.addColorStop(1, 'rgba(255,60,10,0)');
  ctx.fillStyle = glowG;
  ctx.fillRect(stickX - glowR * 3, tipY - glowR * 3, glowR * 6, glowR * 6);
  ctx.restore();

  // 煙を追加
  if (t % 2 === 0) addSmoke(stickX + (Math.random() - 0.5) * 2, tipY);

  // 煙を更新・描画
  particles.forEach((p, i) => {
    p.life++;
    p.drift += p.driftSpeed;
    p.vx += Math.sin(p.drift) * 0.02;
    p.x += p.vx;
    p.y += p.vy;
    p.r += 0.04;

    const lifeRatio = p.life / p.maxLife;
    const fadeAlpha = lifeRatio < 0.2 ? lifeRatio / 0.2 :
                      lifeRatio > 0.7 ? (1 - lifeRatio) / 0.3 : 1;

    if (p.life >= p.maxLife || p.y < 0) {
      particles.splice(i, 1);
      return;
    }

    // 煙の色（白→紫→消える）
    const smokeHue = 270 + lifeRatio * 30;
    const smokeSat = 20 + lifeRatio * 30;
    ctx.fillStyle = `hsla(${smokeHue},${smokeSat}%,80%,${p.alpha * fadeAlpha * 0.6})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (1 + lifeRatio), 0, Math.PI * 2);
    ctx.fill();
  });

  if (t < 400) requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
