<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glitch Surreal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100%;
    min-height: 480px;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas { position: absolute; top: 0; left: 0; }
  .text-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 480px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none; z-index: 10;
  }
  .glitch-title {
    font-size: 52px; font-weight: 900;
    letter-spacing: 0.15em; color: white;
    text-transform: uppercase; position: relative;
    animation: glitch-main 4s ease-in-out infinite;
  }
  .glitch-title::before {
    content: attr(data-text); position: absolute; top: 0; left: 0;
    color: #ff003c;
    clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
    animation: glitch-red 4s ease-in-out infinite;
  }
  .glitch-title::after {
    content: attr(data-text); position: absolute; top: 0; left: 0;
    color: #00ffe7;
    clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
    animation: glitch-cyan 4s ease-in-out infinite;
  }
  @keyframes glitch-main {
    0%,89%,100% { transform: translate(0); }
    90% { transform: translate(-2px, 1px); }
    92% { transform: translate(3px, -1px); }
    94% { transform: translate(-1px, 2px); }
    96% { transform: translate(0); }
  }
  @keyframes glitch-red {
    0%,89%,100% { transform: translateX(0); opacity: 0.7; }
    90% { transform: translateX(6px); opacity: 1; }
    93% { transform: translateX(-4px); }
    96% { transform: translateX(0); }
  }
  @keyframes glitch-cyan {
    0%,89%,100% { transform: translateX(0); opacity: 0.7; }
    91% { transform: translateX(-8px); opacity: 1; }
    94% { transform: translateX(5px); }
    97% { transform: translateX(0); }
  }
  .scan-lines {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
    pointer-events: none; z-index: 5;
    animation: scan-drift 6s linear infinite;
  }
  @keyframes scan-drift { from { background-position: 0 0; } to { background-position: 0 100px; } }
  .sub {
    margin-top: 18px; font-size: 11px;
    letter-spacing: 0.6em; color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    animation: sub-flicker 5s ease-in-out infinite;
  }
  @keyframes sub-flicker {
    0%,93%,100% { opacity: 0.35; }
    94% { opacity: 0; }
    95% { opacity: 0.9; }
    96% { opacity: 0.2; }
    97% { opacity: 0.7; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scan-lines"></div>
<div class="text-layer">
  <h1 class="glitch-title" data-text="SURREAL">SURREAL</h1>
  <p class="sub">signal lost · reality corrupted</p>
</div>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const W = c.width = window.innerWidth || 600;
  const H = c.height = 480;

  const particles = [];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.5 + 0.3,
      hue: Math.random() * 60 - 30,
      phase: Math.random() * Math.PI * 2,
      freq: Math.random() * 0.008 + 0.002,
    });
  }

  let t = 0;

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath();
      for (let y = 0; y <= H; y += 4) {
        const warp = Math.sin(y * 0.015 + t * 0.8 + x * 0.01) * 8 + Math.sin(y * 0.03 + t * 1.2) * 4;
        y === 0 ? ctx.moveTo(x + warp, y) : ctx.lineTo(x + warp, y);
      }
      ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 4) {
        const warp = Math.sin(x * 0.012 + t * 0.6 + y * 0.015) * 6;
        x === 0 ? ctx.moveTo(x, y + warp) : ctx.lineTo(x, y + warp);
      }
      ctx.stroke();
    }
  }

  function drawHorizon() {
    const grad = ctx.createLinearGradient(0, H * 0.4, 0, H * 0.65);
    grad.addColorStop(0, 'rgba(255,0,60,0)');
    grad.addColorStop(0.4, 'rgba(255,0,60,0.08)');
    grad.addColorStop(0.6, 'rgba(0,255,231,0.08)');
    grad.addColorStop(1, 'rgba(0,255,231,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, H * 0.4, W, H * 0.25);

    ctx.strokeStyle = 'rgba(255,0,60,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const y = H * 0.52 + Math.sin(x * 0.02 + t * 1.5) * 14 + Math.sin(x * 0.05 + t * 0.7) * 5;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(0,255,231,0.25)';
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const y = H * 0.525 + Math.sin(x * 0.02 + t * 1.5 + 0.3) * 14 + Math.sin(x * 0.05 + t * 0.7) * 5 + 4;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function drawParticles() {
    particles.forEach(p => {
      p.x += p.vx + Math.sin(t * p.freq * 10 + p.phase) * 0.4;
      p.y += p.vy + Math.cos(t * p.freq * 8 + p.phase) * 0.3;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      const alpha = 0.4 + Math.sin(t * 0.05 + p.phase) * 0.3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${180 + p.hue},80%,70%,${alpha})`;
      ctx.fill();
    });
  }

  function loop() {
    t += 0.016;
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, W, H);
    drawGrid();
    drawHorizon();
    drawParticles();
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
