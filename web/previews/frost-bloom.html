<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frost Bloom</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #040608; display: grid; place-items: center; min-height: 100vh; font-family: "Segoe UI", sans-serif; }
  .stage { position: relative; width: 100%; min-width: 320px; min-height: 480px; display: grid; place-items: center; overflow: hidden; background: #040608; }
  .blob { position: absolute; border-radius: 50%; filter: blur(40px); animation: bloom 4.5s ease-in-out infinite; }
  .blob-1 { width: 260px; height: 260px; background: radial-gradient(circle, rgba(200,230,255,0.12), transparent 70%); animation-delay: 0s; }
  .blob-2 { width: 180px; height: 180px; background: radial-gradient(circle, rgba(180,210,255,0.1), transparent 70%); animation-delay: 1s; }
  .blob-3 { width: 100px; height: 100px; background: radial-gradient(circle, rgba(220,240,255,0.15), transparent 70%); animation-delay: 2s; }
  @keyframes bloom { 0%,100% { transform: scale(0.88); opacity: 0.5; } 50% { transform: scale(1.12); opacity: 1; } }
  .flake { position: absolute; width: 4px; height: 4px; background: rgba(220,240,255,0.5); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: flake-spin 6s linear infinite; }
  .f1 { top: 22%; left: 20%; animation-delay: 0s; }
  .f2 { top: 65%; right: 22%; animation-delay: 2s; width: 6px; height: 6px; }
  .f3 { top: 38%; right: 32%; animation-delay: 4s; width: 3px; height: 3px; }
  @keyframes flake-spin { 0%,100% { transform: rotate(0deg) scale(1); opacity: 0.4; } 50% { transform: rotate(180deg) scale(1.2); opacity: 0.8; } }
  .content { position: relative; z-index: 2; text-align: center; animation: rise-in 1.6s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise-in { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(180,210,255,0.35); margin-bottom: 12px; }
  .title { font-size: 42px; font-weight: 200; letter-spacing: 0.3em; color: rgba(220,235,255,0.9); animation: title-frost 4.5s ease-in-out infinite; }
  @keyframes title-frost { 0%,100% { text-shadow: 0 0 20px rgba(180,210,255,0.15); } 50% { text-shadow: 0 0 40px rgba(180,210,255,0.4), 0 0 70px rgba(200,230,255,0.15); } }
  .divider { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(180,210,255,0.4), transparent); margin: 14px auto; }
  .sub { font-size: 10px; letter-spacing: 0.35em; color: rgba(180,210,255,0.3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
  <div class="flake f1"></div><div class="flake f2"></div><div class="flake f3"></div>
  <div class="content"><p class="label">Landing Page</p><h1 class="title">FROST</h1><div class="divider"></div><p class="sub">Bloom</p></div>
</div>
</body>
</html>
