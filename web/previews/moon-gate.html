<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moon Gate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    min-width: 320px;
    min-height: 480px;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: fade-in 2s ease-out forwards;
  }
  @keyframes fade-in {
    from { opacity:0; transform: translateY(8px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .label {
    font-size: 9px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(200,180,255,0.5);
    margin-bottom: 12px;
  }
  .title {
    font-size: 40px;
    font-weight: 200;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.88);
  }
  .divider {
    width: 30px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,180,255,0.5), transparent);
    margin: 14px auto;
  }
  .sub {
    font-size: 10px;
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.28);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="content">
    <p class="label">Japanese</p>
    <h1 class="title">月門</h1>
    <div class="divider"></div>
    <p class="sub">Moon Gate</p>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

function resize() {
  canvas.width = stage.offsetWidth;
  canvas.height = stage.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

const LOOP = 4000; // ms
const PARTICLE_COUNT = 80;

const particles = Array.from({ length: PARTICLE_COUNT }, (_, i) => ({
  angle: Math.random() * Math.PI * 2,
  speed: 0.3 + Math.random() * 0.7,
  radius: 10 + Math.random() * 20,
  targetRadius: 60 + Math.random() * 120,
  size: 1 + Math.random() * 2.5,
  hue: 200 + Math.random() * 80, // 青〜紫
  delay: Math.random() * 0.6,
  drift: (Math.random() - 0.5) * 0.02,
}));

let start = null;

function draw(ts) {
  if (!start) start = ts;
  const elapsed = (ts - start) % LOOP;
  const t = elapsed / LOOP; // 0〜1

  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;

  ctx.clearRect(0, 0, W, H);

  // 背景グラデーション
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.6);
  bg.addColorStop(0, 'rgba(20,10,35,1)');
  bg.addColorStop(1, 'rgba(9,9,11,1)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 月の輪
  const moonGlow = ctx.createRadialGradient(cx, cy - 20, 0, cx, cy - 20, 100);
  moonGlow.addColorStop(0, 'rgba(220,200,255,0.08)');
  moonGlow.addColorStop(0.5, 'rgba(180,160,240,0.04)');
  moonGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = moonGlow;
  ctx.beginPath();
  ctx.arc(cx, cy - 20, 100, 0, Math.PI * 2);
  ctx.fill();

  // 鳥居シルエット的なリング
  ctx.beginPath();
  ctx.arc(cx, cy - 20, 70, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(200,180,255,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy - 20, 50, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(200,180,255,0.08)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // パーティクル
  particles.forEach(p => {
    const pt = Math.max(0, (t - p.delay) / (1 - p.delay));
    if (pt <= 0) return;

    const eased = pt < 0.5
      ? 2 * pt * pt
      : 1 - Math.pow(-2 * pt + 2, 2) / 2;

    const r = p.radius + (p.targetRadius - p.radius) * eased;
    p.angle += p.drift;
    const x = cx + Math.cos(p.angle) * r;
    const y = (cy - 20) + Math.sin(p.angle) * r * 0.55; // 楕円軌道（和風の奥行き感）

    const alpha = pt < 0.1
      ? pt / 0.1
      : pt > 0.7
        ? 1 - (pt - 0.7) / 0.3
        : 1;

    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 80%, 80%, ${alpha * 0.8})`;
    ctx.fill();

    // グロー
    const glow = ctx.createRadialGradient(x, y, 0, x, y, p.size * 3);
    glow.addColorStop(0, `hsla(${p.hue}, 90%, 90%, ${alpha * 0.3})`);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, p.size * 3, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
