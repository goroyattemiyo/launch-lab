<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dream Dissolve</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: grid; place-items: center; min-height: 480px; overflow: hidden; font-family: Georgia, serif; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .content { position: relative; z-index: 2; text-align: center; animation: dream-float 4s ease-in-out infinite; }
  @keyframes dream-float { 0%,100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-8px); opacity: 1; } }
  .label { font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,200,255,0.4); margin-bottom: 12px; font-family: "Segoe UI", sans-serif; }
  .title { font-size: 44px; font-weight: 300; letter-spacing: 0.25em; color: rgba(255,220,255,0.92); animation: dissolve-glow 4s ease-in-out infinite; }
  @keyframes dissolve-glow { 0%,100% { text-shadow: 0 0 30px rgba(200,100,255,0.3), 0 0 60px rgba(100,100,255,0.1); } 50% { text-shadow: 0 0 50px rgba(200,100,255,0.6), 0 0 100px rgba(150,50,255,0.3); filter: blur(0.3px); } }
  .sub { font-size: 10px; letter-spacing: 0.4em; color: rgba(200,150,255,0.3); text-transform: uppercase; margin-top: 12px; font-family: "Segoe UI", sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <p class="label">Psychedelic</p>
  <h1 class="title">DREAM</h1>
  <p class="sub">Dissolve</p>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = 800; c.height = 480;
const W = c.width, H = c.height;
let t = 0;
const blobs = Array.from({length: 6}, (_, i) => ({
  x: W * (0.2 + Math.random() * 0.6), y: H * (0.2 + Math.random() * 0.6),
  r: 100 + Math.random() * 120, hue: i * 60,
  vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4, phase: Math.random()*Math.PI*2
}));
function draw() {
  t += 0.008;
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  ctx.fillRect(0, 0, W, H);
  blobs.forEach(b => {
    b.x += b.vx + Math.sin(t*0.5+b.phase)*0.5;
    b.y += b.vy + Math.cos(t*0.4+b.phase)*0.4;
    if (b.x < 0 || b.x > W) b.vx *= -1;
    if (b.y < 0 || b.y > H) b.vy *= -1;
    b.hue = (b.hue + 0.2) % 360;
    const r = b.r + Math.sin(t + b.phase) * 30;
    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    grad.addColorStop(0, `hsla(${b.hue},80%,60%,0.25)`);
    grad.addColorStop(0.5, `hsla(${(b.hue+40)%360},90%,50%,0.1)`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
