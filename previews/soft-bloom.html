<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soft Bloom</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    min-width: 320px;
    min-height: 480px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #0d090f;
  }

  /* 内側で膨らむ楕円グロー（Moon Gateと真逆：内発光） */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(1px);
    animation: blob-breathe 4.5s ease-in-out infinite;
  }
  .blob-1 {
    width: 220px; height: 180px;
    background: radial-gradient(ellipse, rgba(255,160,200,0.22), rgba(220,140,255,0.08) 50%, transparent 70%);
    animation-delay: 0s;
  }
  .blob-2 {
    width: 160px; height: 200px;
    background: radial-gradient(ellipse, rgba(180,120,255,0.18), rgba(255,180,220,0.06) 50%, transparent 70%);
    animation-delay: 0.8s;
    transform: rotate(30deg);
  }
  .blob-3 {
    width: 120px; height: 120px;
    background: radial-gradient(ellipse, rgba(255,200,230,0.30), rgba(200,150,255,0.10) 50%, transparent 70%);
    animation-delay: 0.4s;
  }
  .blob-4 {
    width: 80px; height: 80px;
    background: radial-gradient(ellipse, rgba(255,220,240,0.50), rgba(220,180,255,0.20) 50%, transparent 70%);
    animation-delay: 1.2s;
  }

  @keyframes blob-breathe {
    0%,100% { transform: scale(0.88); opacity: 0.6; }
    50%     { transform: scale(1.12); opacity: 1; }
  }

  /* 柔らかなリング（点線） */
  .soft-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,160,200,0.10);
    animation: ring-expand 4.5s ease-in-out infinite;
  }
  .sr-1 { width: 280px; height: 280px; animation-delay: 0s; }
  .sr-2 { width: 200px; height: 200px; animation-delay: 1.0s; border-color: rgba(200,150,255,0.12); }
  @keyframes ring-expand {
    0%   { transform: scale(0.9); opacity: 0; }
    30%  { opacity: 1; }
    70%  { opacity: 0.5; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  /* 浮遊する小粒 */
  .petal {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,180,220,0.7);
    animation: petal-float ease-in-out infinite;
  }
  .petal:nth-child(1) { width:5px;height:5px; top:40%; left:35%; animation-duration:5s; animation-delay:0.0s; }
  .petal:nth-child(2) { width:3px;height:3px; top:35%; left:60%; animation-duration:6s; animation-delay:1.2s; background:rgba(200,150,255,0.7); }
  .petal:nth-child(3) { width:4px;height:4px; top:55%; left:30%; animation-duration:4.5s; animation-delay:2.4s; }
  .petal:nth-child(4) { width:3px;height:3px; top:60%; left:65%; animation-duration:5.5s; animation-delay:0.8s; background:rgba(200,150,255,0.6); }
  .petal:nth-child(5) { width:4px;height:4px; top:45%; left:70%; animation-duration:4.8s; animation-delay:1.8s; }
  @keyframes petal-float {
    0%,100% { transform: translateY(0) translateX(0); opacity: 0.4; }
    25%     { transform: translateY(-12px) translateX(5px); opacity: 0.9; }
    75%     { transform: translateY(8px) translateX(-5px); opacity: 0.6; }
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: soft-in 1.5s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes soft-in {
    from { opacity: 0; transform: scale(0.94) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .label {
    font-size: 9px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(255,160,200,0.55);
    margin-bottom: 12px;
  }
  .title {
    font-size: 42px;
    font-weight: 200;
    letter-spacing: 0.22em;
    color: rgba(255,210,230,0.90);
    text-shadow: 0 0 30px rgba(255,160,200,0.35);
    animation: bloom-pulse 4.5s ease-in-out infinite;
  }
  @keyframes bloom-pulse {
    0%,100% { text-shadow: 0 0 20px rgba(255,160,200,0.25); }
    50%     { text-shadow: 0 0 50px rgba(255,180,220,0.55); }
  }
  .divider {
    width: 24px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,160,200,0.4), transparent);
    margin: 14px auto;
  }
  .sub {
    font-size: 10px;
    letter-spacing: 0.35em;
    color: rgba(255,160,200,0.25);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="soft-ring sr-1"></div>
  <div class="soft-ring sr-2"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="content">
    <p class="label">Cute / Soft</p>
    <h1 class="title">BLOOM</h1>
    <div class="divider"></div>
    <p class="sub">Soft Intro</p>
  </div>
</div>
</body>
</html>
