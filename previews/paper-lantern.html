<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paper Lantern</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    min-width: 320px;
    min-height: 480px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #0a0806;
  }

  /* 温かいアンバー系のグロー層 */
  .glow-warm {
    position: absolute;
    border-radius: 50%;
    animation: lantern-breathe 4s ease-in-out infinite;
  }
  .glow-w1 {
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(255,180,60,0.10), rgba(255,120,20,0.04) 50%, transparent 70%);
  }
  .glow-w2 {
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(255,200,80,0.18), rgba(255,140,30,0.06) 50%, transparent 70%);
    animation-delay: 0.5s;
  }
  .glow-w3 {
    width: 70px; height: 70px;
    background: radial-gradient(circle, rgba(255,220,120,0.45), rgba(255,180,60,0.15) 50%, transparent 70%);
    animation-delay: 0.2s;
  }
  @keyframes lantern-breathe {
    0%,100% { transform: scale(0.94); opacity: 0.7; }
    50%     { transform: scale(1.07); opacity: 1; }
  }

  /* ゆらぎリング */
  .waver {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,160,40,0.12);
    animation: waver 4s ease-in-out infinite;
  }
  .waver-1 { width: 240px; height: 240px; animation-delay: 0s; }
  .waver-2 { width: 180px; height: 180px; animation-delay: 0.6s; border-color: rgba(255,160,40,0.18); }
  .waver-3 { width: 120px; height: 120px; animation-delay: 1.2s; border-color: rgba(255,160,40,0.22); }
  @keyframes waver {
    0%,100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
    33%     { transform: scale(1.04) rotate(1deg); opacity: 0.9; }
    66%     { transform: scale(0.97) rotate(-1deg); opacity: 0.7; }
  }

  /* 上方に漂う光の粒 */
  .spark {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(255,200,80,0.8);
    bottom: 45%;
    animation: float-up linear infinite;
  }
  .spark:nth-child(1) { left: 44%; animation-duration: 3.5s; animation-delay: 0.0s; }
  .spark:nth-child(2) { left: 48%; animation-duration: 4.0s; animation-delay: 0.8s; width:2px;height:2px; }
  .spark:nth-child(3) { left: 52%; animation-duration: 3.2s; animation-delay: 1.6s; }
  .spark:nth-child(4) { left: 46%; animation-duration: 4.5s; animation-delay: 2.4s; width:2px;height:2px; }
  .spark:nth-child(5) { left: 50%; animation-duration: 3.8s; animation-delay: 0.4s; }
  @keyframes float-up {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.8; }
    70%  { opacity: 0.4; }
    100% { transform: translateY(-120px) translateX(10px); opacity: 0; }
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: emerge 1.5s ease-out forwards;
  }
  @keyframes emerge {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  .label {
    font-size: 9px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(255,180,60,0.5);
    margin-bottom: 12px;
  }
  .title {
    font-size: 40px;
    font-weight: 200;
    letter-spacing: 0.3em;
    color: rgba(255,220,140,0.92);
    text-shadow: 0 0 30px rgba(255,160,40,0.4);
    animation: warm-pulse 4s ease-in-out infinite;
  }
  @keyframes warm-pulse {
    0%,100% { text-shadow: 0 0 20px rgba(255,160,40,0.3); }
    50%     { text-shadow: 0 0 40px rgba(255,180,60,0.6); }
  }
  .divider {
    width: 28px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,160,40,0.4), transparent);
    margin: 14px auto;
  }
  .sub {
    font-size: 10px;
    letter-spacing: 0.35em;
    color: rgba(255,160,40,0.28);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow-warm glow-w1"></div>
  <div class="waver waver-1"></div>
  <div class="waver waver-2"></div>
  <div class="waver waver-3"></div>
  <div class="glow-warm glow-w2"></div>
  <div class="glow-warm glow-w3"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="content">
    <p class="label">Japanese</p>
    <h1 class="title">提灯</h1>
    <div class="divider"></div>
    <p class="sub">Paper Lantern</p>
  </div>
</div>
</body>
</html>
