<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glow Pulse</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    min-width: 320px;
    min-height: 480px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #09090b;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    animation: pulse-ring 3s ease-in-out infinite;
  }
  .ring-1 { width: 320px; height: 320px; animation-delay: 0s; }
  .ring-2 { width: 240px; height: 240px; animation-delay: 0.4s; }
  .ring-3 { width: 160px; height: 160px; animation-delay: 0.8s; border-color: rgba(255,255,255,0.18); }

  @keyframes pulse-ring {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50%     { transform: scale(1.06); opacity: 1; }
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    animation: pulse-glow 3s ease-in-out infinite;
  }
  .glow-outer {
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
    animation-delay: 0.2s;
  }
  .glow-inner {
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
    animation-delay: 0s;
  }
  .glow-core {
    width: 40px; height: 40px;
    background: radial-gradient(circle, rgba(255,255,255,0.5), rgba(255,255,255,0.1) 60%, transparent);
    animation-delay: 0.1s;
  }
  @keyframes pulse-glow {
    0%,100% { transform: scale(0.95); opacity: 0.6; }
    50%     { transform: scale(1.08); opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: rise-in 1.2s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes rise-in {
    from { opacity:0; transform: translateY(16px) scale(0.96); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }
  .label {
    font-size: 9px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 12px;
  }
  .title {
    font-size: 44px;
    font-weight: 200;
    letter-spacing: 0.28em;
    color: rgba(255,255,255,0.92);
    animation: title-pulse 3s ease-in-out infinite;
  }
  @keyframes title-pulse {
    0%,100% { text-shadow: 0 0 20px rgba(255,255,255,0.2); }
    50%     { text-shadow: 0 0 40px rgba(255,255,255,0.5); }
  }
  .divider {
    width: 24px;
    height: 1px;
    background: rgba(255,255,255,0.3);
    margin: 14px auto;
  }
  .sub {
    font-size: 10px;
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow glow-outer"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="glow glow-inner"></div>
  <div class="glow glow-core"></div>
  <div class="content">
    <p class="label">Brand Intro</p>
    <h1 class="title">GLOW</h1>
    <div class="divider"></div>
    <p class="sub">Pulse</p>
  </div>
</div>
</body>
</html>
